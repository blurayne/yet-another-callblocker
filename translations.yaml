load_reviews_confirmation_message:
  comment: InfoDialogHelper
  en: Loading online reviews will leak the number to a 3rd party service. Are you sure you want to do it with a number present in your Contacts?
  de: Beim Laden der Online-Bewertungen wird die Nummer an einen fremden Server gesendet. Möchten Sie das wirklich mit einer Nummer aus Ihren Kontakten tun?
  ar: سيؤدي تحميل المراجعات عبر الإنترنت إلى تسريب الرقم إلى خدمة تابعة لجهة خارجية. هل أنت متأكد أنك تريد القيام بذلك برقم موجود في جهات الاتصال الخاصة بك؟
  ca: Carregar les ressenyes en línia filtrarà el número de telèfon a un servei terciari. Estàs segur de fer-ho amb un número dels teus Contactes\?
  el: Η φόρτωση διαδικτυακών κριτικών θα διαρρεύσει τον αριθμό σε υπηρεσία τρίτων. Είστε βέβαιοι ότι θέλετε να το κάνετε με έναν αριθμό που υπάρχει στις Επαφές σας;
  eo: Ŝargado de retaj recenzoj tralikigos la telefonnumeron al triapartia servo. Ĉu vi certas, ke vi volas fari tion malgraŭ telefonnombro en viaj Kontaktoj\?
  es: Cargar las reseñas en línea filtrará el número a un servicio de terceros. ¿Estás seguro de que quieres hacerlo con un número presente en tus Contactos\?
  fi: Verkkoarvostelujen lataaminen vuotaa numeron kolmannen osapuolen palveluun. Haluatko varmasti tehdä sen yhteystiedoissasi olevalle numerolle\?
  fr: La transmission d\'évaluations en ligne divulguera le numéro à un service tiers. Êtes-vous sûr de vouloir le faire avec un numéro présent dans vos contacts ?
  gl: Ao cargar recensións en liña vas descubrir o número a terceiras partes. Tes a certeza de querer compartir este número presento nos teus Contactos\?
  he: טעינת ביקורות מקוונות תדליף את המספר לשירות צד שלישי. האם אתה בטוח שברצונך לעשות זאת עם מספר הנמצא באנשי הקשר שלך\?
  hr: Učitavanjem mrežnih recenzija, taj će broj saznati strana usluga. Je li to stvarno želiš učiniti s brojem u kontaktima\?
  it: Caricare una recensione renderà visibile il numero a servizi di terze parti. Sei sicuro di volerlo fare con un numero presente tra i tuoi Contatti\?
  iw: טעינת ביקורות מקוונות תדליף את המספר לשירות צד שלישי. האם אתה בטוח שברצונך לעשות זאת עם מספר הנמצא באנשי הקשר שלך\?
  nb-rNO: Innlasting av nettbaserte vurderinger lekker nummeret til en tredjepartstjeneste. Er du sikker på at du vil gjøre dette med et nummer som er å finne i kontaktlisten\?
  nl: Door online-recensies te laden, lekt het nummer uit naar een externe dienst. Weet je zeker dat je dit wilt doen met een nummer uit je contactpersonenlijst?
  pl: Wczytanie opinii online spowoduje udostępnienie numeru usłudze zewnętrznej firmy. Czy na pewno chcesz to zrobić z numerem znajdującym się w twoich kontaktach\?
  pt: Carregar avaliações online permitirá a divulgação do número a um serviço de terceiros. Tem a certeza que o quer fazer com um número presente nos seus contactos\?
  pt-rBR: Carregar avaliações online vazará o número para um serviço de terceiros. Tem certeza de que deseja fazer isso com um número presente em seus contatos\?
  ru: Это номер из адресной книги! Для получения отзывов номер передаётся в сторонний сервис и может попасть к третьим лицам. Вы точно хотите посмотреть отзывы на этот номер\?
  sl: Nalaganje spletnih pregledov bo številko razkrilo v storitev tretje osebe. Ali ste prepričani, da želite to storiti s številko v svojih stikih\?
  tr: Çevrim içi değerlendirmelerin yüklenmesi, numarayı 3. taraf bir hizmete sızdıracaktır. Kişilerinizde bulunan bir numara ile bunu yapmak istediğinizden emin misiniz\?
  uk: Це номер з адресної книги! Для отримання відгуків номер передається в сторонній сервіс і може потрапити до третіх осіб. Ви точно хочете подивитися відгуки на цей номер?
  vi: Việc tải các bài đánh giá trực tuyến sẽ làm rò rỉ số điện thoại đến một dịch vụ bên thứ ba. Bạn có chắc bạn muốn làm vậy với một số điện thoại có trong Danh bạ của bạn không\?
  zh-rCN: 加载在线评论会将号码泄露给第三方服务。确定要对在你的通讯录中的该号码进行此操作吗？
  zh-rTW: 載入網絡評論會將號碼洩露給第三方服務。你確定要使用通訊錄中的號碼來執行此操作嗎？
