country_codes_info_summary:
  comment: advanced_preferences.xml summary; AdvancedSettingsFragment
  en: Country codes are used in requests to 3rd party servers. These codes are set to mimic the behavior of the official 3rd party app. If the codes match your real country (may be detected by your IP address) then your requests will look the most inconspicuous. Auto-detection is used by default (based on mobile network information or system locale), which should be fine for most users, but you can set the codes manually. ISO 3166 2-letter codes (like US) are expected
  de: Die Ländercodes werden in den Anfragen an fremde Server verwendet. Sie sind so gesetzt, dass die Anfragen denen der offiziellen App des Anbieters gleichen. Wenn die Codes zu Ihrem tatsächlichen Land passen (das sich aus Ihrer IP-Adresse erkennen lässt), fallen Ihre Anfragen am wenigsten auf. Standardmäßig werden sie automatisch erkannt (anhand des Mobilfunknetzes oder der Systemsprache), was für die meisten reicht; Sie können sie aber auch von Hand setzen. Erwartet werden zweistellige ISO-3166-Codes (wie DE)
  ar: يتم استخدام رموز الدول في الطلبات المرسلة إلى خوادم الطرف الثالث. تم تعيين هذه الرموز لتقليد سلوك تطبيق الجهة الخارجية الرسمي. إذا كانت الرموز تتطابق مع بلدك الحقيقي (قد يتم اكتشافها من خلال عنوان IP الخاص بك) ، فستبدو طلباتك أكثر غموضًا. يتم استخدام الاكتشاف التلقائي افتراضيًا (استنادًا إلى معلومات شبكة الهاتف المحمول أو لغة النظام) ، والتي يجب أن تكون مناسبة لمعظم المستخدمين ، ولكن يمكنك تعيين الرموز يدويًا. من المتوقع ظهور رموز ISO 3166 المكونة من حرفين (مثل الولايات المتحدة)
  ca: Els codis de país s’utilitzen en soŀlicituds a servidors de tercers. Aquests codis estan configurats per imitar el comportament de l\'aplicació oficial de tercers. Si els codis coincideixen amb el vostre país real (la vostra adreça IP pot detectar-los), les vostres soŀlicituds seran més discretes. La detecció automàtica s’utilitza de manera predeterminada (segons la informació de la xarxa mòbil o la configuració regional del sistema), cosa que hauria d’estar bé per a la majoria d’usuaris, però podeu definir els codis manualment. S\'esperen codis ISO 3166 de 2 lletres (com ES)
  el: Οι κωδικοί χωρών χρησιμοποιούνται για αιτήματα σε διακομιστές τρίτων. Αυτοί οι κωδικοί έχουν οριστεί για να μιμούνται τη συμπεριφορά της επίσημης εφαρμογής τρίτων. Εάν οι κωδικοί ταιριάζουν με την πραγματική σας χώρα (ενδέχεται να εντοπιστούν από τη διεύθυνση IP σας), τότε τα αιτήματά σας θα φαίνονται πιο διακριτικά. Η αυτόματη ανίχνευση χρησιμοποιείται από προεπιλογή (βάσει των πληροφοριών του δικτύου κινητής τηλεφωνίας ή τις τοπικές ρυθμίσεις συστήματος), η οποία θα είναι αρκετή για τους περισσότερους χρήστες, αλλά μπορείτε να ορίσετε τους κωδικούς χειροκίνητα. Αναμένονται κωδικοί 2 γραμμάτων ISO 3166 (όπως GR)
  eo: Landokodoj uziĝas en petoj al triapartiaj servoj. Ĉi tiuj kodoj imitas oficialajn triapartiajn programojn. Se la kodoj kongruas kun via reala lando (eble trovebla per via IP-adreso), do viaj petoj aspektos plej nesuspektinde. Aŭtomata trovado estas uzata apriore (laŭ poŝtelefonretaj informoj aŭ sistema lokaĵaro), kio sufiĉos por plejmulto da uzantoj, sed vi povas agordi la kodojn permane. Atendiĝas 2-literaj kodoj laŭ ISO 3166 (ekz. US)
  es: Los códigos de país se utilizan en las peticiones a servidores de terceros. Estos códigos imitan el comportamiento de la aplicación oficial de terceros. Si el código coincide con tu país real (puede ser detectado por tu dirección IP) entonces tus peticiones parecerán poco sospechosas. La autodetección se utiliza por defecto (basada en la información de la red móvil o el sistema local), lo cual debería bastar para la mayoría de usuarios, pero puedes configurar los códigos manualmente. Se esperan códigos ISO 3166 de dos letras (como ES)
  fi: Maakoodeja käytetään pyynnöissä kolmannen osapuolen palvelimille. Nämä koodit on asetettu jäljittelemään virallisen kolmannen osapuolen sovelluksen toimintaa. Jos koodit vastaavat todellista maata (voidaan havaita IP-osoitteestasi), pyyntösi näyttävät kaikkein huomaamattomimmilta. Automaattista tunnistusta käytetään oletusarvoisesti (perustuu matkapuhelinverkkotietoihin tai järjestelmän aluetunnukseen), minkä pitäisi olla sopiva useimmille käyttäjille, mutta voit asettaa koodit manuaalisesti. Odotetaan kaksikirjaimisia ISO 3166 koodeja (kuten FI)
  fr: Les codes de pays sont utilisés dans les requêtes adressées à des serveurs tiers. Ces codes sont définis pour imiter le comportement de l\'application officielle de la tierce partie. Si les codes correspondent à votre pays réel (ils peuvent être détectés par votre adresse IP), vos requêtes seront les plus discrètes. L\'auto-détection est utilisée par défaut (en fonction des informations du réseau mobile ou de la localisation du système), ce qui devrait convenir à la plupart des utilisateurs, mais vous pouvez définir les codes manuellement. Les codes ISO 3166 à 2 lettres (comme ceux des États-Unis) sont attendus
  gl: Os códigos de país son utilizados nas peticións a servidores de terceiras partes. Estos códigos intentan imitar o comportamento da app de terceiras. Se os códigos coinciden co teu país real (pode detectarse polo enderezo IP) entón estas solicitudes serán menos sospeitosas. Úsase por defecto a detección automática (en función da rede móbil ou idioma do sistema), o que debería ser suficiente para a maioría das usuarias, pero podes establecer manualmente os códigos. O sistema agarda por códigos de dúas letras ISO 3166 (como ES)
  he: קודי מדינה משמשים בבקשות לשרתי צד שלישי. קודים אלה מוגדרים לחקות את ההתנהגות של היישום הרשמי של צד שלישי. אם הקודים תואמים למדינה האמיתית שלך (ייתכן שזוהו על ידי כתובת ה-IP שלך) אז הבקשות שלך ייראו בולט ביותר. זיהוי אוטומטי משמש כברירת מחדל (בהתבסס על מידע רשת ניידת או אזור מערכת), אשר אמור להיות בסדר עבור רוב המשתמשים, אך באפשרותך להגדיר את הקודים באופן ידני. בתבנית ISO 3166 בעל שתי אותיות (כמו IL)
  hr: Kodovi zemalja koriste se u upitima za poslužitelje trećih strana. Ovi su kodovi postavljeni tako da oponašaju službene programe treće strane. Ako se kodovi podudaraju s tvojom stvarnom državom (može se otkriti prema tvojoj IP adresi), tada će tvoji zahtjevi imati najviše izgleda. Automatsko otkrivanje koristi se prema standardnim postavkama (na temelju podataka o mobilnoj mreži ili jeziku sustava), što bi trebalo biti u redu za većinu korisnika, ali kodovi se mogu postaviti ručno. Očekuju se dvoslovni brojevi norme ISO 3166
  it: I codici nazionali vengono usati per le richieste ai server di terze parti. Questi codici sono impostati per mimare il comportamento di app ufficiali di terze parti. Se i codici corrispondono alla tua vera nazione (potrebbe essere rilevata dall\'indirizzo IP) allora le tue richieste si noteranno di meno. L\'auto-rilevamento viene usato come predefinito (sulla base delle informazioni della rete mobile o sulla lingua di sistema) e dovrebbe andare bene per la maggior parte degli utenti, ma è possibile impostare i codici manualmente. Ci si aspettano lettere ISO 3166 2 (come negli US)
  iw: קודי מדינה משמשים בבקשות לשרתי צד שלישי. קודים אלה מוגדרים לחקות את ההתנהגות של היישום הרשמי של צד שלישי. אם הקודים תואמים למדינה האמיתית שלך (ייתכן שזוהו על ידי כתובת ה-IP שלך) אז הבקשות שלך ייראו בולט ביותר. זיהוי אוטומטי משמש כברירת מחדל (בהתבסס על מידע רשת ניידת או אזור מערכת), אשר אמור להיות בסדר עבור רוב המשתמשים, אך באפשרותך להגדיר את הקודים באופן ידני. בתבנית ISO 3166 בעל שתי אותיות (כמו IL)
  nb-rNO: Landskoder brukes i forespørsler til tredjepartstjenere. Disse kodene blir satt for å etterligne adferden til det offisielle tredjepartsprogrammet. Hvis kodene stemmer overens med ditt egentlige land (som oftest kan utledes fra din IP–adresse) vil dine forespørsler se mest tilforlatelige ut. Automatisk oppdagelse brukes som forvalg (basert på mobilnettverksinfo, eller systemspråk), som bør være greit for majoriteten av brukere, men du kan sette kodene manuelt. ISO 3166 2-bokstavskoder (som US) forventes
  nl: Landcodes worden gebruikt in verzoeken aan externe servers. Deze codes proberen het gedrag van de officiële externe app na te bootsen. Als de codes overeenkomen met het land waarin je je bevindt (mogelijk op basis van je ip-adres), dan lijken je verzoeken niet verdacht. Standaard wordt automatische herkenning gebruikt (op basis van je mobielenetwerkinformatie of systeemtaal). Dit is bij de meeste mensen afdoende, maar je kunt de codes ook handmatig instellen. De codes dienen ISO 3166-codes met 2 letters te zijn (zoals in de VS)
  pl: Kody krajów używane są w zapytaniach do serwerów zewnętrznych. Kody te ustawione są tak, aby naśladować działanie oficjalnej aplikacji zewnętrznej firmy. Jeśli kod pasuje do kraju, w którym przebywasz (a to może zostać wykryte poprzez twój adres IP), twoje zapytania będą wyglądać najbardziej niepozornie. Domyślnie używane jest automatyczne wykrywanie (na podstawie informacji o sieci komórkowej lub ustawień regionalnych systemu), co powinno wystarczyć większości użytkownikom, ale możesz ustawić kod ręcznie. Jest to 2-literowy kod zgodny ze standardem ISO 3166 (np. PL)
  pt: Os códigos dos países são utilizados em pedidos a servidores de terceiros. Estes códigos são definidos para imitar o comportamento da aplicação oficial de terceiros. Se os códigos corresponderem ao seu país real (podem ser detetados pelo seu endereço IP), então os seus pedidos terão o aspeto mais discreto. É utilizada por defeito a deteção automática é utilizada (baseada na informação da rede móvel ou local do sistema), o que deve ser suficiente para a maioria dos utilizadores, mas pode definir os códigos manualmente. São esperados códigos ISO 3166 de 2 letras (como em US)
  pt-rBR: Os códigos de países são usados em pedidos a servidores de terceiro. Eles são definidos para imitar a ação do aplicativo oficial de terceiro. Se os códigos corresponderem a seu país real (podem ser detectados por seu endereço IP), então seus pedidos serão os mais discretos. A autodetecção é usada por padrão (baseada nas informações da rede móvel ou definição de localidade do sistema), o que deve ser bom para a maioria dos usuários, mas você pode definir os códigos manualmente. São esperados os códigos ISO 3166 de 2 letras (como US)
  ru: Коды стран используются в запросах к сторонним серверам. Эти коды отправляются, для того чтобы имитировать поведение официального приложения. Если коды соответствуют вашей настоящей стране (которая может быть определена по вашему IP-адресу), то запросы будут выглядеть наиболее неприметными. По умолчанию используется автоопределение (по информации мобильной сети или выбранной локали), которое должно устраивать большинство пользователей, но вы можете задать эти коды вручную. Ожидаются двухбуквенные ISO 3166 коды (такие как RU)
  sl: Kode držav se uporabljajo v zahtevah do strežnikov drugih proizvajalcev. Te kode so nastavljene tako, da posnemajo vedenje uradne aplikacije tretje osebe. Če se kode ujemajo z vašo dejansko državo (morda jo zazna vaš naslov IP), bodo vaše zahteve videti najbolj neopazne. Samodejno zaznavanje se uporablja privzeto (na podlagi informacij o mobilnem omrežju ali področne nastavitve sistema), kar bi moralo biti v redu za večino uporabnikov, vendar lahko kode nastavite ročno. Pričakujejo se dvočrkovne kode ISO 3166 (na primer ZDA)
  tr: Ülke kodları, 3. taraf sunuculara yapılan isteklerde kullanılır. Bu kodlar, resmi 3. taraf uygulamasının davranışını taklit edecek şekilde ayarlanmıştır. Kodlar gerçek ülkenize uyuyorsa (IP adresiniz aracılığıyla algılanabilir), o zaman istekleriniz çok göze çarpmayacaktır. Otomatik algılama (mobil ağ bilgilerine veya sistem yerel ayarlarına göre) öntanımlı olarak kullanılır, bu çoğu kullanıcı için uygundur, ancak kodları elle ayarlayabilirsiniz. 2 harfli ISO 3166 kodları (TR gibi) beklenir
  uk: Коди країни використовуються в запитах до сторонніх серверів. Ці коди відправляються, для того щоб імітувати поведінку офіційного додатку. Якщо коди відповідають вашій справжній країні (яка може бути визначена за вашою IP-адресою), то запити будуть виглядати найбільш непримітними. За замовчуванням використовується автовизначення (за інформацією мобільної мережі або обраної локалі), яке повинно влаштовувати більшість користувачів, але ви можете задати ці коди самостійно. Очікуються дволітерні ISO 3166 коди (такі як RU)
  vi: Các mã quốc gia được sử dụng trong các yêu cầu đến các máy chủ bên thứ ba. Các mã đó được đặt để bắt chước hành vi của ứng dụng bên thứ ba chính thức. Nếu các mã đó khớp với quốc gia thật của bạn (có thể được phát hiện qua địa chỉ IP của bạn) thì các yêu cầu của bạn sẽ trông kín đáo nhất. Tự động phát hiện được sử dụng theo mặc định (dựa trên thông tin mạng di động hoặc ngôn ngữ hệ thống), việc này có thể sẽ ổn đối với đa số người dùng, nhưng bạn có thể đặt mã đó theo cách thủ công. Các mã ISO 3166 2 chữ cái (như US) được mong đợi
