  comment: root_preferences.xml summary
  en: 'Mute the ringer for the selected callers instead of blocking them: the call still goes through, is shown by the phone app and ends up in the call log. Contacts are never silenced. Needs \"Advanced call blocking mode\" and Android 10+.'
  de: 'Bei den ausgewählten Anrufern den Klingelton stummschalten, statt den Anruf zu blockieren: Der Anruf kommt weiterhin an, wird von der Telefon-App angezeigt und landet im Anrufprotokoll. Kontakte werden nie stummgeschaltet. Benötigt den „erweiterten Anrufblockierungsmodus“ und Android 10+.'
