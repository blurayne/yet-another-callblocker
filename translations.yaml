limited_mode_info:
  comment: advanced_preferences.xml title
  en: What Direct Boot mode is
  de: Was der Direct-Boot-Modus ist
limited_mode_info_summary:
  comment: advanced_preferences.xml summary; AdvancedSettingsFragment
  en: 'After a restart the phone stays encrypted until you unlock it for the first time. Android calls that Direct Boot, and most apps cannot run at all until then. This one can: its lists and its settings are kept where they can be read before unlocking, so calls are screened even right after a restart.'
  de: 'Nach einem Neustart bleibt das Telefon verschlüsselt, bis Sie es zum ersten Mal entsperren. Android nennt das Direct Boot; die meisten Apps laufen in dieser Zeit gar nicht. Diese schon: Ihre Listen und Ihre Einstellungen liegen dort, wo sie schon vor dem Entsperren lesbar sind, sodass Anrufe auch direkt nach einem Neustart geprüft werden.'
limited_mode_info_option:
  comment: AdvancedSettingsFragment
  en: 'What it cannot read in that time are your contacts - they stay locked away until the phone is unlocked, so a call from a contact looks like a call from a stranger. The setting below decides which kinds of blocking are allowed until then: a kind you switch off here lets those calls through until you unlock the phone.'
  de: 'Nicht lesbar sind in dieser Zeit Ihre Kontakte - sie bleiben gesperrt, bis das Telefon entsperrt wird, und ein Anruf aus den Kontakten sieht deshalb aus wie ein Anruf einer fremden Nummer. Die Einstellung darunter legt fest, welche Arten der Blockierung bis dahin erlaubt sind: Was Sie hier ausschalten, wird bis zum Entsperren durchgestellt.'
