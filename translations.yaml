default_caller_id_app_unset:
  comment: PermissionHelper dialog title
  en: Select a different app as the \"Caller ID app\" in \"Default apps\" in system settings
  de: Legen Sie in den Systemeinstellungen eine andere App als „Anrufer-ID-App“ fest
  ar: حدد تطبيقا مختلفا ك \"تطبيق معرف المتصل\" في \"التطبيقات الافتراضية\" في إعدادات النظام
  ca: Selecciona una aplicació diferent com «aplicació d\'identificació de trucades» en «aplicacions predeterminada» a configuració del sistema
  el: Επιλέξτε μια διαφορετική εφαρμογή ως \"Εφαρμογή αναγνώρισης κλήσης/προστασίας από ανεπιθύμητο περιεχόμενο\" στις \"Προεπιλέγμενες εφαρμογές\" στις ρυθμίσεις
  eo: Elektu alian programon kiel la \"Programon por Identigi Alvokanton\" en \"Implicitaj programoj\" en sistemaj agordoj
  es: Selecciona una aplicación diferente como «Aplicación de identificación de llamadas» en «Aplicaciones predeterminadas» en configuración del sistema
  fi: Valitse toinen sovellus \"Soittajan tunnus -sovellukseksi\" järjestelmäasetusten \"Oletussovellukset\" -kohdassa
  fr: Sélectionnez une autre application comme « Application d\'identification de l\'appelant » dans « Applications par défaut » dans les paramètres système
  gl: Elixe unha app diferente como \"App identificadora de chamadas\" nas \"Apps por defecto\" no sistema
  he: בחר יישום אחר כ\"יישום זיהוי מתקשר\" ב\"יישומי ברירת מחדל\" בהגדרות המערכת
  hr: Odaberi jedan drugi program kao „Program za identifikaciju pozivača” u postavkama sustava pod „Standardni programi”
  it: Seleziona una diversa app \"Caller ID\" tra le app predefinite nelle impostazioni di sistema
  iw: בחר יישום אחר כ\"יישום זיהוי מתקשר\" ב\"יישומי ברירת מחדל\" בהגדרות המערכת
  nb-rNO: Velg et annet program som «anrops-ID-program» i «Forvalgte programmer» i systeminnstillinene.
  nl: Kies een andere app als \'nummermelder-app\' in de sectie \'Standaardapps\' in de systeeminstellingen
  pl: Wybierz inną aplikację jako „Aplikacja do identyfikacji rozmówcy i spamu” w ustawieniach systemowych „Aplikacje domyślne”
  pt: Selecione uma aplicação diferente como \"Aplicação identificadora de chamadas\" em \"Aplicações predefinidas\" nas configurações do sistema
  pt-rBR: Selecione um aplicativo diferente como o \"aplicativo Identificador de Chamadas\" em \"aplicativos padrão\" nas configurações do sistema
  ru: Выберите другое \"приложение для АОН и защиты от спама\" в \"Приложениях по умолчанию\" в настройках системы
  sl: V razdelku \"Privzete aplikacije\" v sistemskih nastavitvah izberite \"drugo aplikacijo za ID klicatelja\"
  tr: Sistem ayarlarındaki \"Öntanımlı uygulamalar\" bölümünde \"Arayan kimliği uygulaması\" olarak farklı bir uygulama seçin
  uk: Виберіть іншу програму як \"Ідентифікатора абонента\" в \"Додатки за замовчуванням\" у системних налаштуваннях
  vi: Chọn một ứng dụng khác làm \"Ứng dụng ID người gọi\" trong \"Ứng dụng mặc định\" trong cài đặt hệ thống
