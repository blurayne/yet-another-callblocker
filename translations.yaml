db_filtering_info_summary:
  comment: db_filtering_preferences.xml summary
  en: The database holds numbers from everywhere. Filtering keeps the ones that can reach you and drops the rest, which saves storage; nothing else about the app changes. It happens while the database is fetched and after every update. Every source is compiled into one table first and a copy of it is put aside; the filter then runs on that table, so filtering always starts from the unfiltered database - and when no copy is kept, the sources are asked for it again rather than a narrowed database being narrowed further
  de: Die Datenbank enthält Nummern aus aller Welt. Beim Filtern bleiben die, die Sie erreichen können, der Rest fällt weg; das spart Speicherplatz und ändert sonst nichts an der App. Gefiltert wird beim Holen der Datenbank und nach jeder Aktualisierung. Alle Quellen werden zuerst zu einer Tabelle zusammengebaut und davon eine Kopie beiseitegelegt; gefiltert wird dann diese Tabelle, also immer ausgehend von der ungefilterten Datenbank – und ist keine Kopie vorhanden, wird bei den Quellen neu geholt, statt eine schon eingeschränkte Tabelle weiter einzuschränken
  ar: تسمح هذه الميزة بتوفير مساحة التخزين عن طريق إزالة بعض البيانات التي لا تنطبق عليك (مثل الأرقام التي تنتمي إلى مناطق أو بلدان مختلفة). لا يؤثر ذلك على الأداء العام للتطبيق (مثل حظر المكالمات). تحدث التصفية أثناء تنزيل قاعدة البيانات الأولية وأثناء تحديث قاعدة البيانات. قد تتم تصفية البيانات الموجودة (التي تم تنزيلها قبل تمكين التصفية) باستخدام خيار \"تصفية قاعدة البيانات\" أدناه. لا يؤدي تعطيل الميزة أو تغيير معلماتها إلى استعادة البيانات التي تمت إزالتها - تحتاج إلى إعادة تنزيل قاعدة البيانات لذلك
  ca: Aquesta funció permet estalviar espai d\'emmagatzematge eliminant algunes dades que no us són aplicables (com ara números que pertanyen a diferents regions o països). No afecta el rendiment general de l\'aplicació (com el bloqueig de trucades). El filtratge es produeix durant la descàrrega inicial de la base de dades i durant l\'actualització de la base de dades. Les dades existents (descarregades abans d\'activar el filtratge) es poden filtrar mitjançant l\'opció «Filtrar la base de dades» a continuació. Desactivar la funció o canviar-ne els paràmetres no restauren les dades eliminades; cal que torneu a descarregar la base de dades per a això
  es: Esta función permite ahorrar espacio de almacenamiento eliminando algunos datos que no te corresponden (como los números que pertenecen a diferentes regiones o países). No afecta al rendimiento general de la aplicación (como el bloqueo de llamadas). El filtrado se produce durante la descarga inicial de la base de datos y durante su actualización. Los datos existentes (descargados antes de activar el filtrado) pueden filtrarse utilizando la opción \"Filtrar la base de datos\" que aparece más abajo. Desactivar la característica o la modificación de sus parámetros no restablece los datos eliminados; para ello, es necesario volver a descargar la base de datos
  fr: Cette fonction permet d\'économiser de l\'espace de stockage en supprimant certaines données qui ne vous concernent pas (comme les numéros appartenant à des régions ou des pays différents). Elle n\'affecte pas les performances générales de l\'application (comme le blocage des appels). Le filtrage a lieu lors du téléchargement initial de la base de données et lors de sa mise à jour. Les données existantes (téléchargées avant l\'activation du filtrage) peuvent être filtrées à l\'aide de l\'option « Filtrer la base de données » ci-dessous. La désactivation de la fonction ou la modification de ses paramètres ne permet pas de restaurer les données supprimées – vous devez télécharger à nouveau la base de données pour cela
  gl: Esta característica permite aforrar espazo de almacenaxe eliminando algúns datos que non se aplican ao teu caso (como número que pertencen a outros países). Non afecta ao rendemento xeral da app (ao bloqueo). O filtrado acontece durante a descarga inicial da base de datos e durante a actualización da base de datos. Os datos existentes (descargados anteriormente a activar o filtro) poden ser filtrados usando a opción \"Filtrar a base de datos\". Desactivando esta ferramenta ou cambiando os seus parámetros non restableces os datos eliminados - terías que volver a descargar a base de datos
  he: תכונה זו מאפשרת לחסוך בשטח אחסון על ידי הסרת נתונים מסוימים שאינם ישימים עבורך (כגון מספרים השייכים לאזורים או למדינות שונים). היא אינה משפיעה על ביצועי אפליקציה כלליים (כגון חסימת שיחות). סינון מתרחש במהלך ההורדה הראשונית של מסד הנתונים ובמהלך עדכון מסד הנתונים. ניתן לסנן נתונים קיימים (שהורדו לפני הפיכת הסינון לזמין) באמצעות האפשרות \"סנן את מסד הנתונים\" להלן. השבתת התכונה או שינוי הפרמטרים שלה אינם משחזרים נתונים שהוסרו - עליך להוריד מחדש את מסד הנתונים לשם כך
  hr: Ova funkcija omogućuje uštedjeti prostor memorije uklanjanjem nekih podataka koji za tebe nisu primjenjivi (poput brojeva koji pripadaju različitim regijama ili zemljama). Ne utječe na opću izvedbu programa (poput blokiranja poziva). Filtriranje se događa tijekom početnog preuzimanja baze podataka i tijekom aktualiziranja baze podataka. Postojeći podaci (preuzeti prije aktiviranja filtriranja) mogu se filtrirati pomoću opcije „Filtriranje baze podataka”. Deaktiviranjem funkcije ili mijenjanjem njezinih parametara, uklonjeni podaci se ne vraćaju – za to moraš ponovo preuzeti bazu podataka
  it: Questa funzione permette di risparmiare spazio di archiviazione rimuovendo alcuni dati che non sono applicabili a voi (come i numeri appartenenti a diverse regioni o paesi). Non influisce sulle prestazioni generali dell\'app (come il blocco delle chiamate). Il filtraggio avviene durante lo scaricamento iniziale della banca dati e durante l\'aggiornamento della banca dati. I dati esistenti (scaricati prima di abilitare il filtraggio) possono essere filtrati usando l\'opzione «Filtra la banca dati» qui sotto. Disattivare la funzione o cambiare i suoi parametri non ripristina i dati rimossi – è necessario riscaricare la banca dati per farlo
  iw: תכונה זו מאפשרת לחסוך בשטח אחסון על ידי הסרת נתונים מסוימים שאינם ישימים עבורך (כגון מספרים השייכים לאזורים או למדינות שונים). היא אינה משפיעה על ביצועי אפליקציה כלליים (כגון חסימת שיחות). סינון מתרחש במהלך ההורדה הראשונית של מסד הנתונים ובמהלך עדכון מסד הנתונים. ניתן לסנן נתונים קיימים (שהורדו לפני הפיכת הסינון לזמין) באמצעות האפשרות \"סנן את מסד הנתונים\" להלן. השבתת התכונה או שינוי הפרמטרים שלה אינם משחזרים נתונים שהוסרו - עליך להוריד מחדש את מסד הנתונים לשם כך
  nl: Met deze functie kun je opslagruimte besparen door onnodige gegevens te wissen (zoals buitenlands nummers). Dit is niet van invloed op de app-prestaties (zoals oproepblokkering). Het filteren wordt alleen uitgevoerd tijdens de eerste keer dat de databank wordt opgehaald en tijdens het bijwerken ervan. Reeds aanwezige gegevens worden gefilterd middels onderstaande optie ‘Databank filteren’. Uitschakelen of aanpassen van de functie herstelt geen gewiste gegevens - daarvoor dien je de databank opnieuw op te halen
  pl: Ta funkcja pozwala zaoszczędzić miejsce w pamięci przez usuwanie niektórych danych, które ciebie nie dotyczą (jak numery należące do innych regionów lub krajów). Nie wpływa to na ogólną wydajność aplikacji (jak blokowanie połączeń). Filtrowanie odbywa się podczas pierwszego pobierania bazy danych i w czasie jej aktualizacji. Istniejące dane (pobrane przed włączeniem filtrowania) można przefiltrować za pomocą poniższej opcji „Filtruj bazę danych”. Wyłączenie funkcji lub zmiana jej parametrów nie przywraca usuniętych danych – w tym celu musisz ponownie pobrać bazę danych
  pt: Este recurso permite economizar espaço de armazenamento removendo alguns dados que não são aplicáveis a si (como números pertencentes a diferentes regiões ou países). Isso não afeta o desempenho geral da aplicação (como o bloqueio de chamadas). A filtragem ocorre durante o descarregamento inicial da base de dados e durante a atualização da base de dados. Os dados existentes (descarregados antes de ativar a filtragem) podem ser filtrados usando a opção \"Filtrar a base de dados\" abaixo. Desativar o recurso ou alterar os parâmetros dele não restauram os dados removidos - tem de descarregar novamente a base de dados
  pt-rBR: Este recurso permite economizar espaço de armazenamento removendo alguns dados que não são aplicáveis a você (como números pertencentes a diferentes regiões ou países). Isso não afeta o desempenho geral do aplicativo (como o bloqueio de chamadas). A filtragem ocorre durante o download inicial do banco de dados e durante a atualização do banco de dados. Os dados existentes (baixados antes de habilitar a filtragem) podem ser filtrados usando a opção \'Filtrar o banco de dados\' abaixo. Desativar o recurso ou alterar seus parâmetros não restauram os dados removidos - você precisa baixar novamente o banco de dados para isso
  ru: Эта функция позволят сэкономить место в хранилище путём удаления неприменимых к вам данных (таких как номера из других регионов и стран). Она не влияет на общую скорость работы приложения (например, на блокировку вызовов). Фильтрация происходит во время начальной загрузки базы и во время её обновления. Существующие данные (загруженные до включения фильтрации) могут быть отфильтрованы с помощью опции \"Отфильтровать базу\" ниже. Отключение фильтрации или изменение её параметров не восстанавливает удалённые данные - для этого вам потребуется загрузить их заново
  tr: Bu özellik, sizin için geçerli olmayan bazı verileri (farklı bölgelere veya ülkelere ait numaralar gibi) kaldırarak depolama alanından tasarruf etmenizi sağlar. Genel uygulama performansını etkilemez (arama engelleme gibi). Filtreleme, ilk veri tabanı indirmesi sırasında ve veri tabanı güncellemesi sırasında gerçekleşir. Var olan veriler (filtreleme etkinleştirilmeden önce indirilenler), aşağıdaki \"Veri tabanını filtrele\" seçeneği kullanılarak filtrelenebilir. Özelliği devre dışı bırakmak veya parametrelerini değiştirmek, kaldırılan verileri geri yüklemez - bunun için veri tabanını yeniden indirmeniz gerekir
  uk: Функція дозволяє заощадити пам\'ять пристрою завдяки видаленню деяких даних, що не використовуються (наприклад телефони інших країн чи регіонів). Це не відображається на продуктивності додатка в цілому(наприклад блокування дзвінків). Фільтрація відбувається під час початкового завантаження та при оновленні бази даних. Існуючі дані (завантажені раніше увімкнення фільтрації) можна відфільтрувати за допомогою опції «Фільтрувати базу даних» нижче. Відключення чи зміна параметрів не відновить видаленні дані - для цього потрібно завантажити базу даних знову
  vi: Tính năng này cho phép tiết kiệm dung lượng bộ nhớ bằng cách xoá một số dữ liệu không áp dụng với bạn (như các số thuộc về các khu vực hoặc quốc gia khác). Nó không ảnh hưởng hiệu năng chung của ứng dụng (như chặn cuộc gọi). Việc lọc xảy ra trong lần tải xuống cơ sở dữ liệu đầu tiên và trong khi cập nhật có sở dữ liệu. Dữ liệu hiện có (đã tải xuống trước khi bật việc lọc) có thể được lọc bằng tuỳ chọn \"Lọc cơ sở dữ liệu\" ở dưới. Việc tắt tính năng này hoặc thay đổi tuỳ chọn của nó sẽ không khôi phục dữ liệu đã xoá - bạn cần tải xuống lại cơ sở dữ liệu để làm việc đó
  zh-rCN: '" "'
