  comment: activity_about.xml text
  en: Where the numbers come from
  de: Woher die Nummern kommen
about_data:
  comment: activity_about.xml text
  en: What this app knows about a number it did not find out itself. The ratings and the reviews come from the Should I Answer community database; a PhoneBlock account adds what that community has collected; lists such as tellows can be added as sources of their own. Behind all of it are people writing down who called them.
  de: Was diese App über eine Nummer weiß, hat sie nicht selbst herausgefunden. Die Bewertungen und die Kommentare stammen aus der Community-Datenbank von Should I Answer; ein PhoneBlock-Konto steuert bei, was dort zusammengetragen wurde; Listen wie tellows lassen sich als eigene Quellen einbinden. Dahinter stehen überall Menschen, die aufschreiben, wer bei ihnen angerufen hat.
