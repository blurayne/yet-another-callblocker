  en: Use the PhoneBlock list
  de: PhoneBlock-Liste verwenden
use_phone_block_summary:
  comment: unused
  en: Download the list and take it into account for incoming calls. It is fetched as a whole once and followed with the changes since, at most once a day
  de: Die Liste herunterladen und bei eingehenden Anrufen berücksichtigen. Sie wird einmal vollständig geladen und danach höchstens einmal täglich um die Änderungen ergänzt
