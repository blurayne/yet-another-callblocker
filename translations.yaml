block_hidden_number_summary:
  comment: root_preferences.xml summary
  en: Block calls from hidden numbers. May work differently (better or worse) in \"Advanced call blocking mode\"
  de: Anrufe mit unterdrückter Nummer blockieren. Im „erweiterten Anrufblockierungsmodus“ kann das anders (besser oder schlechter) funktionieren
  ar: حظر المكالمات من الأرقام المخفية. قد يعمل بشكل مختلف (أفضل أو أسوأ) في \"الوضع المتقدم لحظر المكالمات\"
  ca: Bloca trucades de números ocults. Pot funcionar diferent (millor o pitjor) en «Mode de bloqueig avançat»
  el: Αποκλεισμός κλήσεων από κρυφούς αριθμούς. Ίσως να λειτουργεί διαφορετικά (καλύτερα ή χειρότερα) στη \"Σύνθετη λειτουργία αποκλεισμού κλήσεων\"
  eo: Bloki alvokojn de kaŝitaj telefonnumeroj. Tio eble funkcios alie (pli aŭ malpli bone) en \"Altnivela reĝimo de blokado de alvokoj\"
  es: Bloquear llamadas de números ocultos. Puede que funcione diferente (mejor o peor) en «Modo de bloqueo de llamadas avanzado»
  fi: Estä puhelut piilotetuista numeroista. Voi toimia eri tavalla (paremmin tai huonommin) \"Edistyneessä puhelunestotilassa\"
  fr: Bloquer les appels provenant de numéros masqués. Peut fonctionner différemment (meilleur ou pire) en « Mode de blocage d\'appel avancé »
  gl: Bloquear chamadas de números agochados. Podería funcionar de xeito diferente (mellor ou pior) no \"Modo Avanzado de bloqueo\"
  he: חסום שיחות ממספרים מוסתרים. עשוי לפעול באופן שונה (טוב יותר או גרוע יותר) ב\"מצב חסימת שיחות מתקדם\"
  hr: Blokiraj pozive skrivenih brojeva. Može raditi drugačije (bolje ili gore) u „Napredni način blokiranja poziva”
  it: Blocca chiamate da numeri nascosti. Potrebbe funzionare diversamente (meglio o peggio) in «Modalità blocco chiamate avanzata»
  iw: חסום שיחות ממספרים מוסתרים. עשוי לפעול באופן שונה (טוב יותר או גרוע יותר) ב\"מצב חסימת שיחות מתקדם\"
  nb-rNO: (Eksperimentelt.) Blokker anrop fra skjulte nummer. Fungerer antagelig bedre i \"avansert anropsblokkeringsmodus\". Rapporter din vudering av funksjonaliteten på GitLab
  nl: Blokkeer oproepen van verborgen nummers (dit kan slechter op beter werken in de modus \'Geavanceerde oproepblokkering\')
  pl: Blokuje połączenia z numerów zastrzeżonych. Może działać inaczej (lepiej lub gorzej) w zaawansowanym trybie blokowania połączeń
  pt: Bloqueia chamadas de números ocultos. Pode funcionar de forma diferente (melhor ou pior) no \"Modo avançado de bloqueio de chamadas\"
  pt-rBR: Bloqueia chamadas de números ocultos. Pode funcionar de forma diferente (melhor ou pior) no \"Modo avançado de bloqueio de chamadas\"
  ru: Блокировать звонки со скрытых номеров. Может работать по-разному (лучше или хуже) в \"Продвинутом режиме блокировки вызовов\"
  sl: Blokiraj klice s skritih številk. Lahko deluje drugače (bolje ali slabše) v \"Naprednem načinu blokiranja klicev\"
  tr: Gizli numaralardan gelen aramaları engelle. \"Gelişmiş arama engelleme modunda\" farklı (daha iyi veya daha kötü) çalışabilir
  uk: Блокувати дзвінки від прихованих номерів. Може працювати по різному (краще або гірше) в \"Просунутому режимі блокування викликів\"
  vi: Chặn các cuộc gọi từ những số điện thoại bị ẩn. Có thể sẽ hoạt động khác (tốt hoặc xấu hơn) trong \"Chế độ chặn cuộc gọi nâng cao\"
  zh-rTW: 阻止隱藏號碼的通話。在「進階通話阻止模式」下可能會有所不同（更好或更差）
