help_database_title:
  comment: activity_help.xml text
  en: How the database is built
  de: Wie die Datenbank gebaut wird
help_database:
  comment: activity_help.xml text
  en: 'The app knows nothing about a number by itself: everything comes from the sources you list, in the order you put them in.\n\n\u2022 No source is \"the database\" and the rest additions to it: every source can hand over a whole one, and the order alone decides. The first source fills the empty table; every source after it changes what it knows about, leaves the rest alone, and can also take numbers out again.\n\u2022 The number is the key of the table, so a number several sources know is one entry. The later source changes the fields it has something to say about; the others stay as they were.\n\u2022 A build works on a database of its own, beside the one in use. Only when it is whole does it take the place of the old one \u2013 so a build that fails leaves what worked untouched, and lookups never see a half-built database.\n\u2022 Only numbers matching the pattern you set are written down at all \u2013 the rest are skipped as the sources are read, so the database never holds nine million numbers to delete most of them again. Changing the pattern means building again, which needs no download.\n\u2022 The first source\''s files are the ones the library keeps, and they are only downloaded when there are none, when you point the source somewhere else, or when its own schedule says so \u2013 it is tens of megabytes. \"Fetch now\" on a source fetches it whatever that says.\n\u2022 A number is looked up in that table and not in the downloaded files, so every source counts, whatever it handed over \u2013 and a number a later source took out stays out. What the app fetches between builds goes straight into the table as well.\n\u2022 What each build did, source by source, is in the build log under Database.'
  de: 'Die App weiß von sich aus nichts über eine Nummer: alles kommt aus den Quellen, die Sie angeben, in der Reihenfolge, in die Sie sie bringen.\n\n\u2022 Keine Quelle ist \"die Datenbank\" und die übrigen Zutaten dazu: jede Quelle kann eine ganze Datenbank liefern, und allein die Reihenfolge entscheidet. Die erste Quelle füllt die leere Tabelle; jede weitere ändert, was sie kennt, lässt den Rest in Ruhe \u2013 und kann Nummern auch wieder herausnehmen.\n\u2022 Die Nummer ist der Schlüssel der Tabelle. Eine Nummer, die mehrere Quellen kennen, ist ein Eintrag: die spätere Quelle ändert die Felder, zu denen sie etwas zu sagen hat, der Rest bleibt stehen.\n\u2022 Ein Aufbau arbeitet in einer eigenen Datenbank neben der benutzten. Erst wenn sie vollständig ist, tritt sie an die Stelle der alten \u2013 ein fehlgeschlagener Aufbau lässt also das Funktionierende unangetastet, und Abfragen sehen nie eine halbfertige Datenbank.\n\u2022 Nur Nummern, die auf das eingestellte Muster passen, werden überhaupt geschrieben \u2013 der Rest wird beim Lesen der Quellen übersprungen, damit die Datenbank nie neun Millionen Nummern hält, um die meisten gleich wieder zu löschen. Ein geändertes Muster heißt: neu bauen, wofür nichts heruntergeladen werden muss.\n\u2022 Die Dateien der ersten Quelle sind die, welche die Bibliothek behält; sie werden nur geholt, wenn keine da sind, wenn Sie die Quelle woandershin zeigen lassen oder wenn ihr eigener Zeitplan es sagt \u2013 es sind zig Megabyte. \"Abrufen\" bei einer Quelle holt sie unabhängig davon.\n\u2022 Eine Nummer wird in dieser Tabelle nachgeschlagen und nicht in den heruntergeladenen Dateien. So zählt jede Quelle, ganz gleich was sie geliefert hat \u2013 und eine Nummer, die eine spätere Quelle herausgenommen hat, bleibt draußen. Was die App zwischen zwei Aufbauten holt, geht ebenfalls direkt in die Tabelle.\n\u2022 Was jeder Aufbau getan hat, Quelle für Quelle, steht im Aufbau-Protokoll unter \"Datenbank\".'
help_matching_title:
  comment: activity_help.xml text
  en: What decides about a call
  de: Was über einen Anruf entscheidet
help_matching:
  comment: activity_help.xml text
  en: Some things say \"let it through\" and some say \"block it\", and they are not asked in the order they are listed in the settings.\n\n<b>Allowed, whatever anything else says:</b>\n\u2022 the number is in your contacts\n\u2022 the number is on your whitelist\n\u2022 the number is on the allow list of your PhoneBlock account\n\nNothing below is consulted then \u2013 a call from a contact is never blocked.\n\n<b>Otherwise it is blocked by the first of these that applies</b> (each only if you switched it on):\n1. the number is withheld\n2. the community database rates it negative\n3. it is on your blacklist\n4. PhoneBlock has it as spam, or it is on the block list of your account\n\nOn Android 11 and newer, a call the network says is not coming from the number it claims is blocked before any of this, if you switched that on.\n\nWhen the phone has not been unlocked since it was started, your contacts and lists can\'t be read. What may still block then is a setting of its own in the advanced settings.
  de: Manches sagt \"durchlassen\" und manches \"blockieren\", und gefragt wird nicht in der Reihenfolge, in der es in den Einstellungen steht.\n\n<b>Erlaubt, was immer sonst gilt:</b>\n\u2022 die Nummer steht in Ihren Kontakten\n\u2022 die Nummer steht auf Ihrer Weißen Liste\n\u2022 die Nummer steht auf der Erlaubt-Liste Ihres PhoneBlock-Kontos\n\nDann wird nichts von dem darunter noch gefragt \u2013 ein Anruf aus den Kontakten wird nie blockiert.\n\n<b>Sonst blockiert das Erste, was zutrifft</b> (jeweils nur, wenn Sie es eingeschaltet haben):\n1. die Nummer ist unterdrückt\n2. die Community-Datenbank bewertet sie negativ\n3. sie steht auf Ihrer Schwarzen Liste\n4. PhoneBlock führt sie als Spam, oder sie steht auf der Sperrliste Ihres Kontos\n\nAb Android 11 wird ein Anruf, von dem das Netz sagt, dass er nicht von der angezeigten Nummer kommt, schon vor all dem blockiert \u2013 wenn Sie das eingeschaltet haben.\n\nSolange das Telefon seit dem Einschalten nicht entsperrt wurde, sind Kontakte und Listen nicht lesbar. Was dann trotzdem blockieren darf, ist eine eigene Einstellung unter \"Erweitert\".
help_lists_title:
  comment: activity_help.xml text
  en: The lists themselves
  de: Die Listen selbst
help_lists:
  comment: activity_help.xml text
  en: '\u2022 A number is matched in every form it can be written in: +4930123456, 004930123456 and 030123456 are the same number, and an entry in any of those forms finds it.\n\u2022 An entry can be a pattern rather than a number \u2013 49* covers every German number \u2013 and the app shows which entry matched, so a call blocked by a pattern says which pattern it was.\n\u2022 Putting a number on one list takes it off the other.\n\u2022 The whitelist wins over the blacklist, and contacts win over both.'
  de: '\u2022 Eine Nummer wird in jeder Schreibweise erkannt: +4930123456, 004930123456 und 030123456 sind dieselbe Nummer, und ein Eintrag in einer dieser Formen findet sie.\n\u2022 Ein Eintrag kann ein Muster statt einer Nummer sein \u2013 49* umfasst alle deutschen Nummern \u2013 und die App zeigt, welcher Eintrag gegriffen hat.\n\u2022 Eine Nummer auf die eine Liste zu setzen nimmt sie von der anderen.\n\u2022 Die Weiße Liste sticht die Schwarze, und Kontakte stechen beide.'
