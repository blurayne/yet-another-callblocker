auto_updates_summary:
  comment: db_management_preferences.xml summary
  en: Automatically receive daily updates of the number database (these are incremental/delta updates, so they consume very little traffic)
  de: Die Nummerndatenbank täglich aktualisieren (die Aktualisierungen enthalten nur die Änderungen und verbrauchen daher sehr wenig Datenvolumen)
  ar: تلقي التحديثات اليومية لقاعدة بيانات الأرقام تلقائيا
  ca: Rep actualitzacions diàries de la del número de base de dades automàticament (aquestes són actualitzacions incrementals, consumeixen poc tràfic)
  el: Αυτόματη λήψη ημερήσιων ενημερώσεων της βάσης δεδομένων (αυτές είναι προσθετικές/delta ενημερώσεις, επομένως καταναλώνουν πολύ λίγα δεδομένα)
  eo: Aŭtomate ricevi ĉiutagajn ĝisdatigojn de la datenbanko de telefonnumeroj (tiuj estas alkrementaj ĝisdatigoj kaj tial uzas malmultege da trafiko)
  es: Recibe actualizaciones diarias de la base de datos de números (estas actualizaciones son incrementales, por lo que consumen muy poco tráfico)
  fi: Vastaanota päivittäisiä tietokantapäivityksiä automaattisesti (nämä ovat inkrementaalisia / delta-päivityksiä, joten ne kuluttavat hyvin vähän liikennettä)
  fr: Recevoir automatiquement les mises à jour quotidiennes de la base de données de numéros (ce sont des mises à jour incrémentielles/delta, donc elles consomment très peu de trafic)
  gl: Recibe actualizacións diarias de xeito automático para a base de datos (son actualizacións en incrementos, polo que consumen moi poucos datos)
  he: קבל באופן אוטומטי עדכוני מסד נתונים מספריים יומיים (אלה עדכונים מצטברים/דלתא, כך שהם צורכים מעט מאוד תעבורה)
  hr: Automatski primaj dnevna aktualiziranja baze podataka brojeva (inkrementalna/delta aktualiziranja, stoga troši malo prometa)
  it: Ottieni automaticamente aggiornamenti giornalieri del database (sono aggiornamenti incrementali che consumano molto poco traffico)
  iw: קבל באופן אוטומטי עדכוני מסד נתונים מספריים יומיים (אלה עדכונים מצטברים/דלתא, כך שהם צורכים מעט מאוד תעבורה)
  nb-rNO: Motta daglige databaseoppdateringer (disse legger kun til endringer, slik at de bruker lite data)
  nl: Ontvang automatisch databankupdates (dit zijn kleine updates, dus kosten ze niet veel data)
  pl: Automatycznie aktualizuje bazę danych każdego dnia (są to aktualizacje przyrostowe, więc zużywają bardzo mało danych)
  pt: Recebe automaticamente atualizações diárias da base de dados (estas são atualizações incrementais/delta, portanto consomem muito pouco tráfego)
  pt-rBR: Recebe automaticamente atualizações diárias do banco de dados (estas são atualizações incrementais/delta, portanto consomem muito pouco tráfego)
  ru: Автоматическое получение ежедневных обновлений базы номеров (это инкрементальные/дельта-обновления, поэтому они потребляют очень мало трафика)
  sl: Samodejno prejemajte dnevne posodobitve zbirke številk (to so postopne / delta posodobitve, tako da porabijo zelo malo prometa)
  tr: Numara veri tabanının günlük güncellemelerini otomatik olarak al (bunlar artımlı/delta güncellemelerdir, bu nedenle çok az veri harcarlar)
  uk: Автоматично отримувати щоденні оновлення бази даних номерів (завантажуються тільки зміни, тому витрата трафіку невелика)
  vi: Tự động nhận các bản cập nhật hàng ngày của cơ sở dữ liệu số điện thoại (chúng là bản cập nhật thêm vào/delta, nên chúng tiêu tốn rất ít lưu lượng)
