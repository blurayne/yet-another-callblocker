  comment: root_preferences.xml summary
  en: Block calls that the network reports as calling from a number that isn\'t theirs (STIR/SHAKEN). Needs Android 11+ and a network that checks it - where it isn\'t in use, no call is ever reported as forged and this does nothing. Contacts are never blocked
  de: Anrufe blockieren, bei denen das Netz meldet, dass die angezeigte Nummer nicht die des Anrufers ist (STIR/SHAKEN). Benötigt Android 11+ und ein Netz, das das prüft – wo es nicht im Einsatz ist, wird kein Anruf als gefälscht gemeldet und diese Einstellung bewirkt nichts. Kontakte werden nie blockiert
