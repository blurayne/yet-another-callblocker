save_crashes_to_external_storage_summary:
  comment: advanced_preferences.xml summary
  en: Save crash reports and logs to public storage, otherwise crash reports are saved to a private app folder. The reports may contain sensitive data (phone numbers, contact names). Other apps with storage permission may have access to this data in public storage
  de: Absturzberichte und Protokolle im öffentlichen Speicher ablegen statt in einem privaten Ordner der App. Die Berichte können vertrauliche Daten enthalten (Telefonnummern, Kontaktnamen); im öffentlichen Speicher können andere Apps mit Speicherberechtigung darauf zugreifen
  ar: احفظ تقارير الأعطال والسجلات في وحدة التخزين العامة، وإلا سيتم حفظ تقارير الأعطال في مجلد تطبيق خاص. قد تحتوي التقارير على بيانات حساسة (أرقام الهواتف وأسماء جهات الاتصال). قد تتمكن التطبيقات الأخرى الحاصلة على إذن التخزين من الوصول إلى هذه البيانات في وحدة التخزين العامة
  ca: Deseu els informes d’errors i els registres a l’emmagatzematge públic; en cas contrari, els informes d’errors es desaran a una carpeta privada de l\'aplicació. Els informes poden contenir dades confidencials (números de telèfon, noms de contacte). És possible que altres aplicacions amb permís d’emmagatzematge tinguin accés a aquestes dades a l’emmagatzematge públic
  el: Αποθηκεύστε τις αναφορές σφαλμάτων και τα αρχεία καταγραφής σε δημόσιο χώρο αποθήκευσης, διαφορετικά οι αναφορές αποθηκεύονται σε έναν ιδιωτικό φάκελο της εφαρμογής. Οι αναφορές ενδέχεται να περιέχουν ευαίσθητα δεδομένα (αριθμούς τηλεφώνου, ονόματα επαφών). Άλλες εφαρμογές με άδεια αποθήκευσης ενδέχεται να έχουν πρόσβαση σε αυτά τα δεδομένα σε δημόσιο χώρο αποθήκευσης
  eo: Konservi kolapsraportojn kaj protokolojn en publikan konservejon; alie, kolapsraportoj konserviĝas en privata programa dosierujo. La raportoj povas enhavi konfidencajn datenojn (telefonnumeroj, kontaktonomoj). Aliaj programoj kun rajto atingi konservejon povas atingi tiajn datenojn en publika konservejo
  es: Guarda informes de fallo y registros en almacenamiento público, de otro modo los informes se guardan en la carpeta privada de la aplicación. Los informes pueden contener datos sensibles (números de teléfono, nombres de contacto). Otras aplicaciones con permisos de almacenamiento pueden acceder a estos datos en el almacenamiento público
  fi: Tallenna kaatumisraportit ja lokit julkiseen tallennustilaan, muuten kaatumisraportit tallennetaan yksityiseen sovelluskansioon. Raportit voivat sisältää arkaluontoisia tietoja (puhelinnumerot, yhteyshenkilöiden nimet). Muilla sovelluksilla, joilla on tallennusoikeus, voi olla pääsy näihin tietoihin julkisessa tallennustilassa
  fr: Sauvegarder les rapports et les journaux d\'incidents sur le stockage public, sinon les rapports d\'incidents sont sauvegardés dans un dossier privé de l\'application. Les rapports peuvent contenir des données sensibles (numéros de téléphone, noms de contact). D\'autres applications ayant une autorisation de stockage peuvent avoir accès à ces données dans le stockage public
  gl: Garda informes dos fallos e rexistros na almacenaxe pública, doutro xeito os informes de fallos gárdanse nun cartafol privado da app. Estes informes poderían conter datos sensibles (números de teléfono, nomes de contacto). Outras apps con permiso de almacenaxe poderían ter acceso a estos datos da almacenaxe pública
  he: שמור דוחות קריסה ויומני רישום באחסון ציבורי, אחרת דוחות קריסה יישמרו בתיקיית יישום פרטית. הדוחות עשויים להכיל נתונים רגישים (מספרי טלפון, שמות אנשי קשר). יישומים אחרים עם הרשאת אחסון עשויים לקבל גישה לנתונים אלה באחסון ציבורי
  hr: Spremi izvještaje i log-zapise o rušenju aplikacije u javno spremište, u protivnom se izvještaji o rušenju spremaju u privatnu mapu programa. Izvještaji mogu sadržavati osjetljive podatke (telefonske brojeve, imena kontakata). Ostali programi s dozvolom za spremanje podataka mogu pristupiti tim podacima u javnom spremištu
  it: Salva i resoconti dei crash su risorse pubbliche, in alternativa vengono salvati in una cartella privata dell\'app. I resoconti possono contenere dati sensibili (numeri di telefono, nomi dei contatti). Le altre app con permesso di accesso alla memoria possono accedere a questi dati
  iw: שמור דוחות קריסה ויומני רישום באחסון ציבורי, אחרת דוחות קריסה יישמרו בתיקיית יישום פרטית. הדוחות עשויים להכיל נתונים רגישים (מספרי טלפון, שמות אנשי קשר). יישומים אחרים עם הרשאת אחסון עשויים לקבל גישה לנתונים אלה באחסון ציבורי
  nb-rNO: Lagre krasjrapporter og logger til offentlig lager, ellers lagres kræsjrapporter til en privat programdatamappe. Rapportene inneholder sensitiv data (telefonnumre, kontaktnavn). Andre programmer med lagringstilgang kan ha tilgang til denne dataen i offentlig lager
  nl: Sla crashverslagen en logboeken op op de openbare opslagruimte van je apparaat in plaats van in een privémap. De verslagen kunnen gevoelige informatie bevatten, zoals telefoonnummers en namen van contactpersonen. Andere apps met toegang tot je opslag hebben mogelijk toegang tot deze gegevens
  pl: Zapisuje raporty o awariach i logi w pamięci publicznej. W przeciwnym razie raporty o awariach zapisywane są w prywatnym folderze aplikacji. Raporty mogą zawierać dane poufne (numery telefonów, nazwy kontaktów). Inne aplikacje z uprawnieniami do przechowywania mogą mieć dostęp do tych danych w pamięci publicznej
  pt: Guarda os relatórios de erros e registos no armazenamento público, caso contrário, os relatórios de erros são guardados numa pasta privada da aplicação. Os relatórios podem conter dados sigilosos (números de telefone, nomes de contacto). As outras aplicações com permissão de armazenamento podem ter acesso a estes dados no armazenamento público
  pt-rBR: Salva os relatórios de erros e registros para o armazenamento público, caso contrário, os relatórios de erros são salvos em uma pasta privada do aplicativo. Os relatórios podem conter dados sigilosos (números de telefone, nomes de contato). Outros aplicativos com permissão de armazenamento podem ter acesso a estes dados no armazenamento público
  ru: Сохранять отчёты об ошибках и логи в общее хранилище. В противном случае отчёты сохраняются в личную папку приложения. Отчёты могут содержать конфиденциальные данные (номера телефонов, имена контактов). Другие приложения с разрешением на доступ к хранилищу могут иметь доступ к этим данным в общем хранилище
  sl: Poročila o zrušitvah shranite v javni pomnilnik, sicer se poročila o zrušitvah shranijo v zasebno mapo aplikacije. Poročila lahko vsebujejo občutljive podatke (telefonske številke, imena stikov). Druge aplikacije z dovoljenjem za shranjevanje imajo lahko dostop do teh podatkov v javnem pomnilniku
  tr: Çökme raporlarını ve günlük kayıtlarını genel depolamaya kaydedin, aksi takdirde çökme raporları özel bir uygulama klasörüne kaydedilir. Raporlar hassas veriler (telefon numaraları, kişi adları) içerebilir. Depolama iznine sahip diğer uygulamaların bu verilere genel depolama alanında erişimi olabilir
  uk: Зберігати звіти про помилки та журнали в загальне сховище. В іншому випадку звіти зберігаються в особисту теку програми. Звіти можуть містити конфіденційні дані (номери телефонів, імена контактів). Інші додатки з дозволом на доступ до сховища можуть мати доступ до цих даних в загальному сховищі
  vi: Lưu các báo cáo dừng đột ngột và nhật ký ra bộ nhớ công khai, nếu không thì các báo cáo dừng đột ngột được lưu vào một thư mục ứng dụng riêng. Các báo cáo đó có thể chứa dữ liệu nhạy cảm (số điện thoại, tên liên hệ). Các ứng dụng khác có quyền bộ nhớ có thể có quyền truy cập vào dữ liệu này trong bộ nhớ công khai
