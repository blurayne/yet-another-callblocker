  de: Das Token Ihres PhoneBlock-Kontos – nötig, falls die Liste nicht ohne heruntergeladen werden kann, und zum Melden von Nummern. Registrieren Sie sich auf phoneblock.net; das Token steht dann unter phoneblock.net/phoneblock/show-api-key
