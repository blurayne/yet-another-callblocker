export_logcat_summary:
  comment: advanced_preferences.xml summary
  en: Export and share logcat contents with an app of your choosing (for example with an email client). The reports may contain sensitive data (phone numbers, contact names). Only the chosen app will have access to this data
  de: Die Logcat-Ausgabe exportieren und mit einer App Ihrer Wahl teilen (zum Beispiel per E-Mail). Das Protokoll kann vertrauliche Daten enthalten (Telefonnummern, Kontaktnamen); nur die gewählte App erhält Zugriff darauf
  ar: تصدير محتويات logcat ومشاركتها مع تطبيق من اختيارك (على سبيل المثال مع عميل بريد إلكتروني). قد تحتوي التقارير على بيانات حساسة (أرقام الهواتف وأسماء جهات الاتصال). فقط التطبيق المختار سيكون لديه حق الوصول إلى هذه البيانات
  ca: Exporteu i compartiu contingut de logcat amb una aplicació que trieu (per exemple, amb un client de correu electrònic). Els informes poden contenir dades confidencials (números de telèfon, noms de contacte). Només l\'aplicació escollida tindrà accés a aquestes dades
  el: Εξαγωγή και κοινή χρήση περιεχομένων της καταγραφής με μία εφαρμογή της επιλογής σας (για παράδειγμα με την εφαρμογή email). Οι αναφορές ενδέχεται να περιέχουν ευαίσθητα δεδομένα (αριθμούς τηλεφώνου, ονόματα επαφών). Μόνο η επιλεγμένη εφαρμογή θα έχει πρόσβαση σε αυτά τα δεδομένα
  eo: Eksporti kaj sendi protokolon al programo elektebla de vi (ekzemple al retpoŝtilo). La raportoj povas enhavi konfidencajn datenojn (telefonnumerojn, kontaktonomojn). Nur la elektita programo atingos tiajn datenojn
  es: Exportar y compartir los contenidos del logcat con una aplicación de tu elección (por ejemplo un cliente de correo-e). Los informes pueden contener datos sensibles (números de teléfono, nombres de contacto). Sólo la aplicación escogida tendrá acceso a estos datos
  fi: Vie ja jaa logcat-sisältö valitsemallesi sovellukselle (esimerkiksi sähköpostiohjelmalle). Raportit voivat sisältää arkaluontoisia tietoja (puhelinnumerot, yhteystietojen nimet). Vain valitulla sovelluksella on pääsy näihin tietoihin
  fr: Exporter et partager le contenu de la logcat avec une application de votre choix (par exemple avec un client de messagerie). Les rapports peuvent contenir des données sensibles (numéros de téléphone, noms de contacts). Seule l’application choisie aura accès à ces données
  gl: Exportar e compartir o contido do logcat cunha app da túa elección (por exemplo un cliente de email). Estes informes poderían conter datos sensibles (números de teléfono, nome dos contactos). Só a app elexida terá acceso a estos datos
  he: ייצא ושתף תוכן logcat עם יישום שבחרת (למשל עם לקוח דוא\"ל). הדוחות עשויים להכיל נתונים רגישים (מספרי טלפון, שמות אנשי קשר). רק ליישום שנבחר תהיה גישה לנתונים אלה
  hr: Izvezi i dijeli sadržaja logcata sa željenim programom (na primjer, s klijentom e-pošte). Izvještaji mogu sadržavati osjetljive podatke (telefonske brojeve, imena kontakata). Pristup ovim podacima imat će samo odabrani program
  it: Esporta e condividi i contenuti di logcat con un\'applicazione di tua scelta (ad esempio con un cliente di posta elettronica). I rapporti possono contenere dati sensibili (numeri di telefono, nomi di contatti). Solo l\'applicazione scelta avrà accesso a questi dati
  iw: ייצא ושתף תוכן logcat עם יישום שבחרת (למשל עם לקוח דוא\"ל). הדוחות עשויים להכיל נתונים רגישים (מספרי טלפון, שמות אנשי קשר). רק ליישום שנבחר תהיה גישה לנתונים אלה
  nb-rNO: Eksporter og del logcat-innhold med et program du velger (for eksempel en e-postklient). Rapportene kan inneholde sensitive data (telefonummer, kontaktnavn). Kun valgt program vil ha tilgang til denne dataen.
  nl: Exporteer en deel de logboekinhoud met een app naar keuze (bijv. een e-mailapp). De verslagen kunnen gevoelige gegevens bevatten, zoals telefoonnummers en namen van contactpersonen. Alleen de gekozen app heeft toegang tot deze gegevens.
  pl: Eksportuje i udostępnia zawartość logcat wybranej aplikacji (np. klientowi poczty e-mail). Raporty mogą zawierać dane poufne (numery telefonów, nazwy kontaktów). Tylko wybrana aplikacja będzie miała dostęp do tych danych
  pt: Exporta e partilha o conteúdo do logcat com uma aplicação à sua escolha (por exemplo, com um cliente de e-mail). Os relatórios podem conter dados sigilosos (números de telefone, nomes de contactos). Só a aplicação escolhida terá acesso a estes dados
  pt-rBR: Exporta e compartilha o conteúdo do logcat com um aplicativo de sua escolha (por exemplo, com um cliente de e-mail). Os relatórios podem conter dados sigilosos (números de telefone, nomes de contatos). Só o aplicativo escolhido terá acesso a esses dados
  ru: Экспортировать и поделиться содержимым logcat с приложением по вашему выбору (например, с email-клиентом). Отчёты могут содержать конфиденциальные данные (номера телефонов, имена контактов). Только выбранное приложение получит доступ к этим данным
  tr: Logcat içeriğini dışa aktarın ve seçtiğiniz bir uygulama ile (örneğin bir e-posta istemcisiyle) paylaşın. Raporlar hassas veriler (telefon numaraları, kişi adları) içerebilir. Bu verilere sadece seçilen uygulama erişebilecektir
  uk: Експортувати і поділитися вмістом logcat з додатком за вашим вибором (наприклад, з email-клієнтом). Звіти можуть містити конфіденційні дані (номери телефонів, імена контактів). Тільки обраний додаток отримає доступ до цих даних
  vi: Xuất và chia sẻ nội dung nhật ký bằng một ứng dụng bạn chọn (ví dụ là bằng một ứng dụng email). Các báo cáo này có thể chứa dữ liệu nhạy cảm (số điện thoại, tên liên hệ). Chỉ có ứng dụng được chọn sẽ có quyền truy cập vào dữ liệu này
