apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'

/*
 * Optional release signing.
 *
 * The credentials are taken from the environment (that's what the CI uses) or from
 * a `keystore.properties` file in the project root (for local builds):
 *
 *     storeFile=/path/to/keystore.jks
 *     storePassword=...
 *     keyAlias=...
 *     keyPassword=...
 *
 * If they aren't provided, the release build is left unsigned as it was before.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def keystoreValue = { String envName, String propertyName ->
    def value = System.getenv(envName) ?: keystoreProperties[propertyName]
    value?.toString()?.trim() ?: null
}

def keystorePath = keystoreValue('YACB_KEYSTORE_FILE', 'storeFile')
def signRelease = keystorePath != null && file(keystorePath).exists()

if (keystorePath != null && !signRelease) {
    logger.warn("The keystore ${keystorePath} doesn't exist, the release build won't be signed")
}

/**
 * What the working tree was when this was built.
 *
 * <p>A build that isn't the one someone thinks it is costs an evening, so the APK carries the
 * revision it came from, the branch, and whether anything was uncommitted at the time.
 */
def gitOutput(File dir, String... command) {
    try {
        def process = new ProcessBuilder(command).directory(dir).redirectErrorStream(true).start()
        def output = process.inputStream.text.trim()

        return process.waitFor() == 0 ? output : ""
    } catch (Exception ignored) {
        return ""
    }
}

def gitRevision = {
    def revision = gitOutput(rootDir, "git", "rev-parse", "--short=8", "HEAD")
    if (!revision) return "unknown"

    // a build from a tree with changes in it is not the revision it names
    return gitOutput(rootDir, "git", "status", "--porcelain") ? revision + "+" : revision
}()

def gitBranch = {
    // on CI the checkout is detached, and the name is in the environment instead
    def name = System.getenv("GITHUB_REF_NAME")
    if (name) return name

    name = gitOutput(rootDir, "git", "rev-parse", "--abbrev-ref", "HEAD")

    return name && name != "HEAD" ? name : "unknown"
}()

def buildTime = {
    def format = new java.text.SimpleDateFormat("yyyy-MM-dd HH:mm 'UTC'", Locale.US)
    format.timeZone = TimeZone.getTimeZone("UTC")

    return format.format(new Date())
}()

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "net.evolution515.callblocker"
        minSdkVersion 14
        targetSdkVersion 33
        versionCode 5170
        versionName "0.5.17"

        buildConfigField "String", "GIT_REVISION", "\"${gitRevision}\""
        buildConfigField "String", "GIT_BRANCH", "\"${gitBranch}\""
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [eventBusIndex: 'net.evolution515.callblocker.EventBusIndex']
            }
        }
    }
    signingConfigs {
        /*
         * A debug keystore that is part of the repo, so that every build - local or CI - signs
         * the debug APK with the same key and the builds can be installed over each other.
         * Android's debug credentials are fixed and public by design; this key is only ever
         * used for debug builds and must never be used for anything that is distributed.
         */
        debug {
            storeFile rootProject.file('ci-debug.keystore')
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (signRelease) {
                storeFile file(keystorePath)
                storePassword keystoreValue('YACB_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias keystoreValue('YACB_KEY_ALIAS', 'keyAlias')
                keyPassword keystoreValue('YACB_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signRelease) {
                signingConfig signingConfigs.release
            }
        }
    }
    applicationVariants.all { variant ->
        variant.resValue "string", "app_id", variant.applicationId
    }
    lintOptions {
        lintConfig file("lint.xml")
        abortOnError false
    }
}

greendao {
    // 2: the notes of a blacklist entry; YacbDbOpenHelper adds the column to an existing database
    schemaVersion 2
}

dependencies {
    def eventbus_version = '3.2.0'

    implementation 'org.slf4j:slf4j-api:1.7.32'
    runtimeOnly 'com.github.tony19:logback-android:2.0.0'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    //noinspection GradleDependency: 3.12.* is the latest version compatible with Android <5
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'com.gitlab.xynngh:LibPhoneNumberInfo:c77bdd2b69'
    implementation 'org.apache.commons:commons-csv:1.8'

    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'androidx.paging:paging-runtime:2.1.2'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.preference:preference:1.1.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // 2.7.0 is the first release that creates its PendingIntents the way Android 12+ demands:
    // with an older one, WorkManager's initialization crashes an app that targets 31 or above
    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation "org.greenrobot:eventbus:$eventbus_version"
    annotationProcessor "org.greenrobot:eventbus-annotation-processor:$eventbus_version"
}
