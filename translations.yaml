number_pattern_hint:
  comment: activity_edit_blacklist_item.xml text; activity_edit_whitelist_item.xml text
  en: 'Enter the number in +COUNTRY-NUMBER format (as Android would show in your dialer). Three things can stand in for digits: \"*\" for any digits or none, \"#\" for exactly one digit, and \"{30,40}\" for one of several alternatives. For example, +49{30,40}* covers every number starting with +4930 or +4940, and +49301234## covers the hundred numbers of that extension range. The form the number was dialled or logged in does not matter: an entry written as +49221472585 also covers a call logged as 0221472585.'
  de: 'Geben Sie die Nummer im Format +LAND-NUMMER ein (so, wie Android sie im Telefon anzeigt). Drei Dinge können für Ziffern stehen: „*“ für beliebig viele Ziffern (auch keine), „#“ für genau eine Ziffer und „{30,40}“ für eine von mehreren Möglichkeiten. So erfasst +49{30,40}* jede Nummer, die mit +4930 oder +4940 beginnt, und +49301234## die hundert Nummern dieses Durchwahlbereichs. Die Schreibweise spielt keine Rolle: Ein Eintrag als +49221472585 erfasst auch einen Anruf, der als 0221472585 in der Anrufliste steht.'
  ca: Introduïu el número en format +PAÍS-NÚMERO (com es mostraria a Android al marcador). Utilitzeu «*» com a comodí per a zero o més dígits i «#» per a un dígit exactament.
  el: Εισαγάγετε τον αριθμό σε μορφή +ΧΩΡΑ-ΑΡΙΘΜΟΣ (όπως εμφανίζεται στην Android συσκευή σας κατά την κλήση). Χρησιμοποιήστε το \"*\" ως σύμβολο υποκατάστασης για κανένα ή περισσότερα ψηφία και το \"#\" για ακριβώς ένα ψηφίο.
  eo: Tajpu la telefonnumeron laŭ la aranĝo +LANDO-TELEFONNUMERO (kiel Android montras en via telefonilo). Uzu \"*\" kiel ĵokeron por nul aŭ pli da ciferoj, kaj \"#\" por ekzakte unu cifero.
  es: Introduce el número en el formato +PAÍS-NÚMERO (tal y como Android lo mostraría en tu marcador). Utiliza «*» como comodín para cero o más dígitos, y «#» para exactamente un dígito.
  fi: Kirjoita numero +MAANUMERO-muodossa (kuten Android näyttäisi puhelinsovelluksessa). Käytä merkkiä \"*\" jokerimerkkinä nollalle tai useammalle numerolle ja \"#\" tarkalleen yhdelle numerolle.
  fr: 'Entrez le numéro au format +INDICATIF-PAYS (comme Android l’indique dans votre clavier). Utilisez « * » comme caractère générique pour zéro ou plus de chiffres, et « # » pour exactement un chiffre.'
  gl: Escribe o número co formato +PAÍS-NÚMERO (como mostra Android no teu marcador). Usa \"*\" como comodín para ningún ou varios díxitos, e \"#\" para exactamente un díxito.
  he: הזן את המספר בתבנית +קוד-מדינה (כפי שאנדרואיד מציג בחייגן שלך, בישראל +972). השתמש ב-\"*\" כתו כללי עבור אפס ספרות או יותר ו-\"#\" עבור ספרה אחת בדיוק.
  hr: Upiši broj u formatu +BROJ-DRŽAVE (kao što bi Android pokazao u biraču). Koristi „*” kao zamjenski znak za nulu ili više znamenki, a „#” za točno jednu znamenku.
  it: Inserisci il numero in formato +CODICE-NAZIONE (come mostrerebbe Android durante le chiamate). Usa \"*\" al posto di zero o più numeri e \"#\" per una cifra esatta.
  iw: הזן את המספר בתבנית +קוד-מדינה (כפי שאנדרואיד מציג בחייגן שלך, בישראל +972). השתמש ב-\"*\" כתו כללי עבור אפס ספרות או יותר ו-\"#\" עבור ספרה אחת בדיוק.
  nb-rNO: Skriv inn nummeret i +LANDSKODE-format (som Android ville vist det ved androp). Bruk «*» som jokertegn for ingen flere tall, og «#» for akkurat ett tall.
  nl: Voer het nummer in met voorafgaand +LANDCODE (zoals Android het toont in de telefoonapp). Gebruik \'*\' als jokerteken voor een nul of meerdere getallen en \'#\' voor precies één getal.
  pl: Wpisz numer w formacie +KRAJ-NUMER (tak jak Android pokazałby w aplikacji telefonu). Użyj znaku „*” jako wieloznacznika (ang. wildcard) dla dowolnej liczby cyfr oraz „#” dla dokładnie jednej cyfry.
  pt: Introduza o número no formato +COUNTRY-NUMBER (como o Android mostra no ecrã ao marcar. Use \"*\" como wildcard para zero ou mais dígitos, e \"#\" para exatamente um dígito.
  pt-rBR: Digite o número em formato nacional (como o Android mostraria em seu discador). Use \"*\" como curinga para zero ou mais dígitos, e \"#\" para exatamente um dígito.
  ru: Введите номер в формате +СТРАНА-НОМЕР (как Android показал бы в списке вызовов). Используйте \"*\" как подстановку для нуля и более цифр и \"#\" для одной цифры.
  tr: Numarayı +ÜLKE-NUMARA biçiminde girin (arama sırasında Android aygıtınızın göstereceği gibi). Sıfır veya daha fazla basamak için joker karakter olarak \"*\" ve tam olarak bir basamak için \"#\" kullanın.
  uk: Введіть номер в форматі +КРАЇНА-НОМЕР (як Android показав би в списку викликів). Використовуйте \"*\" як підстановку для нуля і більше цифр і \"#\" для однієї цифри.
  vi: Nhập số ở định dạng +SỐ QUỐC GIA (như Android sẽ hiện trong ứng dụng gọi). Sử dụng \"*\" để chọn tất cả cho không hoặc nhiều chữ số, và \"#\" cho chỉ một chữ số.
