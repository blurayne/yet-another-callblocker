use_call_screening_service_summary:
  comment: root_preferences.xml summary
  en: Allows to block calls before the phone starts to ring. Requires the app to be set as the \"Phone app\" (Android 7–9) or as the \"Caller ID app\" (Android 10+)
  de: Erlaubt es, Anrufe zu blockieren, bevor das Telefon zu klingeln beginnt. Dafür muss die App als „Telefon-App“ (Android 7–9) bzw. als „Anrufer-ID-App“ (Android 10+) festgelegt sein
  ar: يسمح بحظر المكالمات قبل أن يبدأ الهاتف في الرنين. يتطلب تعيين التطبيق ك \"تطبيق الهاتف\" (Android 7–9) أو \"تطبيق معرف المتصل\" (Android 10+)
  ca: Permet blocar trucades abans que el telèfon comenci a sonar. Requereix que l\'aplicació es configuri com «Aplicació de telèfon» (Android 7–9) o com «Aplicació d\'identificació de trucades» (Android 10+)
  el: Επιτρέπει τον αποκλεισμό κλήσεων πριν αρχίσει να κουδουνίζει το τηλέφωνο. Απαιτεί η εφαρμογή να οριστεί ως \"Εφαρμογή τηλεφώνου\" (Android 7–9) ή ως \"Εφαρμογή αναγνώρισης κλήσης\" (Android 10+)
  eo: Permesas blokadon de alvokoj antaŭ ol la telefono eksonoras. Postulas, ke ĉi tiu programo estu la \"Telefona programo\" (Android 7–9) aŭ \"Programo por Identigi Alvokanton\" (Android 10+)
  es: Permite bloquear llamadas antes de que el teléfono empiece a sonar. Requiere que la aplicación sea la «Aplicación de teléfono» (Android 7–9) o la «Aplicación de identificación de llamadas» (Android 10+)
  fi: Sallii puheluiden estämisen ennen kuin puhelin alkaa soida. Edellyttää, että sovellus asetetaan \"Puhelinsovellukseksi\" (Android 7–9) tai \"Soittajan tunnus -sovellukseksi\" (Android 10+)
  fr: Permet de bloquer les appels avant que le téléphone ne commence à sonner. Nécessite que l\'application soit définie comme appli téléphone (Android 7–9) ou comme appli « reconnaissance d\'appel entrant » (Android 10+)
  gl: Permite bloquear chamadas antes de comezar a sonar. Require establecer a app como \"App de Teléfono\" (Android 7–9) ou como \"App identificadora de chamas\" (Android 10+)
  he: מאפשר לחסום שיחות לפני שהטלפון מתחיל לצלצל. נדרש להגדיר את היישום כ\"יישום הטלפון \"(Android 7–9) או כ\"יישום שיחה מזוהה\" (Android 10+)
  hr: Omogućuje blokiranje poziva prije nego što telefon počne zvoniti. Program se mora postaviti kao „Program za telefoniranje” (Android 7–9) ili kao „Program za identifikaciju pozivača” (Android 10+)
  it: Permetti di bloccare le chiamate prima che il telefono squilli. E\' necessario che l\'app sia impostata come \"App telefono\" (Android 7–9) o come app \"Caller ID\" (Android 10+)
  iw: מאפשר לחסום שיחות לפני שהטלפון מתחיל לצלצל. נדרש להגדיר את היישום כ\"יישום הטלפון \"(Android 7–9) או כ\"יישום שיחה מזוהה\" (Android 10+)
  nb-rNO: Blokkerer anrop før telefonen runger. Krever at programmet er satt som \"Telefonprogram\" (Android 7–9) eller som \"Samtale-ID-program\" (Android 10+)
  nl: Hiermee blokkeer je oproepen voordat de beltoon klinkt. Om dit te gebruiken dien je de app in te stellen als \'telefoonapp\' (Android 7–9) of \'nummermelder-app\' (Android 10 en hoger).
  pl: Pozwala blokować połączenia, zanim telefon zacznie dzwonić. Wymaga ustawienia aplikacji jako „Aplikacja do obsługi telefonu” (Android 7–9) lub „Aplikacja do identyfikacji rozmówcy i spamu” (Android 10+)
  pt: Permite bloquear chamadas antes que o telefone comece a tocar. Requer que a aplicação seja configurada como a \"Aplicação de Telefone\" (Android 7–9) ou como a \"Aplicação identificadora de chamadas\" (Android 10+)
  pt-rBR: Permite bloquear chamadas antes que o telefone comece a tocar. Requer que o app seja configurado como o \"app de Telefone\" (Android 7–9) ou como o \"app Identificador de Chamadas\" (Android 10+)
  ru: Позволяет блокировать вызовы до того, как телефон начнёт звонить. Это требует назначить приложение \"приложением для звонков\" (на Android 7–9) или \"приложением для АОН и защиты от спама\" (на Android 10+)
  sl: Omogoča blokiranje klicev, preden telefon zazvoni. Zahteva, da je aplikacija nastavljena kot »Telefonska aplikacija« (Android 7–9) ali kot »aplikacija Caller ID« (Android 10+)
  tr: Telefon çalmaya başlamadan önce aramaları engellemeye izin verir. Uygulamanın \"Telefon uygulaması\" (Android 7–9) veya \"Arayan kimliği uygulaması\" (Android 10+) olarak ayarlanması gerekir
  uk: Дозволяє блокувати виклики до того, як телефон задзвонить. Це вимагає призначити додаток \"додатком для дзвінків \" (на Android 7–9) або \"додатком для АВН і захисту від спаму\" (на Android 10 +)
  vi: Cho phép chặn cuộc gọi trước khi điện thoại bắt đầu đổ chuông. Yêu cầu ứng dụng được đặt làm \"Ứng dụng điện thoại\" (Android 7–9) hoặc làm \"Ứng dụng ID người gọi\" (Android 10+)
