  de: Die Datei enthält Ihre Einstellungen, beide Listen – also Ihre eigenen Nummern – und, weil Sie es so eingestellt haben, Ihre Tokens und Passwörter im Klartext.\n\nBewahren Sie sie dort auf, wo Sie auch die Passwörter selbst aufbewahren würden.
