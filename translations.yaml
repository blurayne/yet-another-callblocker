  de: Die gebaute Datenbank mit in das Sicherungsverzeichnis schreiben, damit ein aus der Sicherung eingerichtetes Telefon sofort blockieren kann, ohne erst zu laden und zu bauen. Sie wird erst nach einem neuen Aufbau wieder geschrieben
