contacts_are_not_blocked_blacklist_notice:
  comment: activity_edit_blacklist_item.xml text
  en: Calls from contacts are never blocked (even on pattern match)
  de: Anrufe von Kontakten werden nie blockiert (auch wenn ein Muster passt)
  ca: Les trucades dels contactes mai es bloquen (fins i tot amb coincidència de patrons)
  el: Κλήσεις από τις επαφές δεν αποκλείονται ποτέ (ακόμα και αν ταιριάζει με μοτίβο)
  eo: Alvokoj de kontaktoj neniam estas blokitaj (eĉ malgraŭ kongruo kun ŝablono)
  es: Las llamadas de contactos nunca se bloquean (incluso si coincide con un patrón)
  fi: Yhteystietojen puheluita ei koskaan estetä (edes kaavojen täsmätessä)
  fr: Les appels des contacts ne sont jamais bloqués (même en cas de correspondance de modèle)
  gl: Nunca se bloquean as chamadas dos contactos (incluso se aplica un filtro)
  he: שיחות מאנשי קשר לעולם אינן חסומות (אפילו אם תואמים לתבנית)
  hr: Pozivi osoba u kontaktima nikada se ne blokiraju (čak niti u slučaju poklapanja s formatom)
  it: Le chiamate dai contatti non vengono mai bloccate (anche se corrispondono a un numero bloccato)
  iw: שיחות מאנשי קשר לעולם אינן חסומות (אפילו אם תואמים לתבנית)
  nb-rNO: Anrop fra kontakter blokkeres aldri (selv ikke om mønster stemmer)
  nl: Oproepen van contactpersonen worden nooit geblokkeerd (zelfs niet als een patroon overeenkomt)
  pl: Połączenia od kontaktów nigdy nie są blokowane (nawet przy dopasowaniu wzorca)
  pt: As chamadas dos contactos nunca são bloqueadas (mesmo se os padrões coincidirem)
  pt-rBR: Chamadas de contatos nunca são bloqueadas (mesmo se os padrões combinam)
  ru: Звонки от контактов никогда не блокируются (даже при совпадении с шаблоном)
  tr: Kişilerden gelen aramalar asla engellenmez (şablon eşleşse bile)
  uk: Дзвінки від контактів ніколи не блокуються (навіть якщо є збіг з шаблоном)
  vi: Các cuộc gọi từ danh bạ không bao giờ bị chặn (kể cả khi khớp với mẫu)
contacts_are_not_blocked_not_enabled:
  comment: EditBlacklistItemActivity
  en: Calls from contacts may be blocked because the \"Use contacts\" option is not enabled!
  de: Anrufe von Kontakten werden möglicherweise blockiert, weil „Kontakte verwenden“ ausgeschaltet ist!
  ca: Es poden blocar les trucades dels contactes perquè l\'opció «Utilitza contactes» no està activada!
  el: Κλήσεις από τις επαφές ενδέχεται να αποκλειστούν επειδή η επιλογή \"Χρήση επαφών\" δεν είναι ενεργοποιημένη!
  eo: Alvokoj de kontaktoj eble estos blokitaj, ĉar la opcio \"Uzi kontaktojn\" ne estas ŝaltita!
  es: ¡Las llamadas de contactos pueden ser bloqueadas porque la opción «Usar contactos» no está marcada!
  fi: Yhteystietojen puhelut saatetaan estää, koska \"Käytä yhteystietoja\" -vaihtoehto ei ole käytössä!
  fr: Les appels des contacts peuvent être bloqués car l\'option « Utiliser les contacts » n\'est pas activée !
  gl: As chamadas dos contactos poderían ser bloquedas por que non está activada a opción \"Usar contactos\"!
  he: ייתכן ששיחות מאנשי קשר ייחסמו מכיוון שהאפשרות \"השתמש באנשי קשר\" אינה מופעלת!
  hr: Pozivi osoba u kontaktima se možda blokiraju, jer opcija „Koristi kontakte” nije aktivirana!
  it: Le chiamate dai contatti potrebbero essere bloccate in quanto l\'opzione \"Usa contatti\" non è attiva!
  iw: ייתכן ששיחות מאנשי קשר ייחסמו מכיוון שהאפשרות \"השתמש באנשי קשר\" אינה מופעלת!
  nb-rNO: Anrop fra kontakter kan bli blokkert fordi «Bruk kontakter»-alternativer ikke er påskrudd!
  nl: Oproepen van contactpersonen worden mogelijk geblokkeerd omdat de optie \'Contactpersonen uitlezen\' niet is ingeschakeld!
  pl: Połączenia od kontaktów mogą być blokowane, ponieważ opcja „Użyj kontaktów” nie jest włączona!
  pt: As chamadas de contactos podem ser bloqueadas se a opção \"Usar contactos\" não estiver ativada!
  pt-rBR: Chamadas de contatos podem ser bloqueadas se a opção \"Usar contatos\" não estiver habilitada!
  ru: Звонки от контактов могут быть заблокированы, поскольку опция \"Доступ к контактам\" не включена!
  tr: Kişilerden gelen aramalar, \"Kişileri kullan\" seçeneği etkin olmadığı için engellenebilir!
  uk: Дзвінки від контактів можуть бути заблоковані, тому що опцію \"Використовувати контакти\" вимкнено!
  vi: Các cuộc gọi từ danh bạ có thể sẽ bị chặn vì tuỳ chọn \"Sử dụng danh bạ\" không được bật!
contacts_are_not_blocked_no_permission:
  comment: EditBlacklistItemActivity
  en: Calls from contacts may be blocked because the \"Contacts\" permission is not granted!
  de: Anrufe von Kontakten werden möglicherweise blockiert, weil die Berechtigung „Kontakte“ fehlt!
  ca: Es poden blocar les trucades dels contactes perquè el permís \"Contactes\" no està concedit!
  el: Κλήσεις από τις επαφές ενδέχεται να αποκλειστούν επειδή δεν έχει παραχωρηθεί η άδεια \"Επαφές\"!
  eo: Alvokoj de kontaktoj eble estos blokitaj, ĉar la permeso \"Kontaktoj\" ne estas donita!
  es: ¡Las llamadas de contactos pueden ser bloqueadas porque no se ha dado el permiso «Contactos»!
  fi: Yhteystietojen puhelut saatetaan estää, koska \"Yhteistiedot\" -käyttöoikeutta ei ole myönnetty!
  fr: Les appels des contacts peuvent être bloqués car l\'autorisation « Contacts » n\'est pas accordée !
  gl: As chamadas dos contactos poderían ser bloqueadas porque non se concedeu o permiso \"Contactos\"!
  he: ייתכן ששיחות מאנשי קשר נחסמו מאחר שהרשאת \"אנשי קשר\" לא הוענקה!
  hr: Pozivi osoba u kontaktima se možda blokiraju, jer „Kontakti” nemaju odgovarajuću dozvolu!
  it: Le chiamate dai contatti potrebbero essere bloccate in quanto il permesso di lettura dei Contatti non è stato concesso!
  iw: ייתכן ששיחות מאנשי קשר נחסמו מאחר שהרשאת \"אנשי קשר\" לא הוענקה!
  nb-rNO: Anrop fra kontakter kan bli blokkert fordi «kontakt»-tilgang ikke er innvilget!
  nl: Oproepen van contactpersonen worden mogelijk geblokkeerd omdat het recht \'Contactpersonen\' niet is verleend!
  pl: Połączenia od kontaktów mogą być blokowane, ponieważ uprawnienie „Kontakty” nie jest przyznane!
  pt: As chamadas de contactos podem ser bloqueadas se a permissão de \"Contactos\" não foi concedida!
  pt-rBR: Chamadas de contatos podem ser bloqueadas se a permissão de \"Contatos\" não foi concedida!
  ru: Звонки от контактов могут быть заблокированы, поскольку разрешение на доступ к контактам не предоставлено!
  tr: Kişilerden gelen aramalar, \"Kişiler\" izni verilmediği için engellenebilir!
  uk: Дзвінки від контактів можуть бути заблоковані, тому що не надано дозвіл на використання контантів!
  vi: Các cuộc gọi từ danh bạ có thể sẽ bị chặn vì quyền \"Danh bạ\" không được cấp!
