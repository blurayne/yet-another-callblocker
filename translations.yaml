use_monitoring_service_summary:
  comment: root_preferences.xml summary
  en: Enables an always-running monitoring service that helps with receiving telephony events on some phones. Enable this feature only if call blocking and informational notifications don\'t work. This feature has no effect on battery life
  de: Startet einen dauerhaft laufenden Dienst, der auf manchen Telefonen hilft, Telefonieereignisse zu empfangen. Schalten Sie ihn nur ein, wenn die Anrufblockierung und die Benachrichtigungen sonst nicht funktionieren. Auf die Akkulaufzeit hat er keinen Einfluss
  ar: تمكين خدمة مراقبة تعمل دائما تساعد في تلقي الأحداث الهاتفية على بعض الهواتف. قم بتمكين هذه الميزة فقط إذا لم يعمل حظر المكالمات والإشعارات الإعلامية. هذه الميزة ليس لها أي تأثير على عمر البطارية
  ca: Activa un servei de vigilància sempre actiu que ajuda amb la recepció d\'esdeveniments de telefonia en alguns telèfons. Activa aquesta característica només si el bloqueig de trucades i les notificacions informatives no funcionen. Aquesta característica no té cap efecte en la vida de la bateria
  el: Ενεργοποιεί μία υπηρεσία παρακολούθησης που λειτουργεί πάντα και η οποία βοηθά στη λήψη γεγονότων τηλεφωνίας σε ορισμένες συσκευές. Ενεργοποιήστε αυτή τη λειτουργία μόνο εάν ο αποκλεισμός κλήσεων και οι ενημετωτικές ειδοποιήσεις δεν λειτουργούν. Αυτή η λειτουργία δεν έχει καμία επίπτωση στη διάρκεια ζωής της μπαταρίας
  eo: Ŝaltas ĉiam funkciantan monitoradan servon, kiu helpas ricevi telefonajn eventojn en iuj telefonoj. Ŝaltu ĉi tiun funkcion nur se taŭgas ne blokado de alvokoj nek informaj sciigoj. Ĉi tiu funkcio ne mallongigas vivdaŭron de baterio
  es: Activa un servicio de vigilancia siempre activo que ayuda en la recepción de eventos de telefonía en algunos teléfonos. Activa esta característica sólo si el bloqueo de llamadas y las notificaciones informativas no funcionan. Esta característica no tiene efecto en la vida de la batería
  fi: Mahdollistaa jatkuvasti käynnissä olevan valvontapalvelun, joka auttaa vastaanottamaan puhelintapahtumia joissakin puhelimissa. Ota tämä ominaisuus käyttöön vain, jos puhelun esto ja ilmoitukset eivät toimi. Tällä ominaisuudella ei ole vaikutusta akun kestoon
  fr: Active un service de suivi toujours en cours d\'exécution qui aide à recevoir des évènements de téléphonie sur certains téléphones. Activez cette fonctionnalité uniquement si le blocage des appels et les notifications d\'information ne fonctionnent pas. Cette fonction n\'a aucun effet sur la durée de vie de la batterie
  gl: Permite un servizo de monitorización sempre activo que axuda a recibir eventos de telefonía nalgúns teléfonos. Activa esta característica se o bloqueo e a notificación non funcionan. Esta función non afecta á duración da batería
  he: מתן אפשרות לשירות ניטור הפועל תמיד ומסייע בקבלת אירועי טלפוניה בטלפונים מסוימים. הפוך תכונה זו לזמינה רק אם חסימת שיחות והודעות מידע אינן פועלות. לתכונה זו אין השפעה על חיי הסוללה
  hr: Omogućuje stalno pokrenutu uslugu praćenja koja pomaže pri primanju telefonskih događaja na nekim telefonima. Aktiviraj ovu funkciju samo ako blokiranje poziva i informativna obavještavanja ne rade. Ova funkcija nema utjecaja na vijek trajanja baterije
  it: Attiva un servizio di monitoraggio sempre attivo che su alcuni telefoni aiuta a ricevere gli eventi telefonata. Attiva questa caratteristica solo se il blocco chiamate e le notifiche informative non funzionano. Questa caratteristica non ha effetto sulla batteria
  iw: מתן אפשרות לשירות ניטור הפועל תמיד ומסייע בקבלת אירועי טלפוניה בטלפונים מסוימים. הפוך תכונה זו לזמינה רק אם חסימת שיחות והודעות מידע אינן פועלות. לתכונה זו אין השפעה על חיי הסוללה
  nb-rNO: Skrur på en overvåkningstjeneste som alltid kjører. Den hjelper deg å motta telefonihendelser på noen telefoner. Kun skru dette på hvis samtaleblokkering og info-merknader ikke virker. Denne funksjonen har ingen innvirkning på batteribruk
  nl: Schakelt een altijd actieve monitoringsdienst in die helpt telefoniegebeurtenissen te onderscheppen. Schakel dit alleen in als oproepblokkering en meldingen niet werken. Deze functie heeft geen invloed op de accuduur
  pl: Włącza stale działającą usługę monitorowania, która pomaga w odbieraniu zdarzeń telefonicznych na niektórych telefonach. Włącz tę funkcję tylko wtedy, gdy blokowanie połączeń i powiadomienia informacyjne nie działają. Ta funkcja nie ma wpływu na żywotność baterii
  pt: Ativa um serviço de monitorização sempre em execução que ajuda na receção de eventos telefónicos em alguns telefones. Ative esta opção apenas se o bloqueio de chamadas e as notificações informativas não funcionarem. Esta opção não tem efeito sobre a vida útil da bateria
  pt-rBR: Permite um serviço de monitoramento sempre em execução que ajuda na recepção de eventos telefônicos em alguns telefones. Habilite este recurso somente se o bloqueio de chamadas e as notificações informativas não funcionarem. Este recurso não tem efeito sobre a vida útil da bateria
  ru: Включает постоянно запущенную службу мониторинга, которая помогает получать события телефонии на некоторых телефонах. Включайте эту функцию, только если блокирование вызовов и информационные уведомления не работают. Эта функция не влияет на расход энергии
  sl: Omogoča stalno delujočo nadzorno storitev, ki pomaga pri sprejemanju telefonskih dogodkov na nekaterih telefonih. Omogočite to funkcijo samo, če blokiranje klicev in informativna obvestila ne delujejo. Ta funkcija ne vpliva na življenjsko dobo baterije
  tr: Bazı telefonlarda telefon olaylarının alınmasına yardımcı olan, sürekli çalışan bir izleme hizmetini etkinleştirir. Bu özelliği sadece arama engelleme ve bilgilendirme bildirimleri çalışmıyorsa etkinleştirin. Bu özelliğin pil ömrü üzerinde hiçbir etkisi yoktur
  uk: Дозволяє Службі моніторингу працювати постійно, це допомагає отримувати події телефонії на деяких телефонах. Використовуйте цю функцію, тільки якщо блокування дзвінків та інформаційні сповіщення не працюють. Ця функція не впливає на споживання батареї
  vi: Bật một dịch vụ giám sát luôn chạy, nó giúp với việc nhận các sự kiện điện thoại trên một số điện thoại. Chỉ bật tính năng này nếu chặn cuộc gọi và thông báo có tính thông tin không hoạt động. Tính năng này không ảnh hưởng đến tuổi thọ pin
