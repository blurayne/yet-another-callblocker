denied_default_dialer_message:
  comment: PermissionHelper toast
  en: Advanced call blocking won\'t work due to the app not being set as the \"Phone app\"
  de: Die erweiterte Anrufblockierung ist erst verfügbar, wenn die App als „Telefon-App“ festgelegt ist
  ar: لن يعمل الحظر المتقدم للمكالمات بسبب عدم تعيين التطبيق على أنه \"تطبيق الهاتف\"
  ca: El bloqueig de trucades avançat no funcionarà perquè l\'aplicació no és l\'«Aplicació de telèfon»
  el: Ο σύνθετος αποκλεισμός κλήσεων δεν θα λειτουργήσει επειδή η εφαρμογή δεν έχει οριστεί ως \"Εφαρμογή Tηλεφώνο\"
  eo: Altnivela alvoko-blokado ne funkcios pro ke ĉi tiu programo ne estas la implicita \"Telefona programo\"
  es: Bloqueo de llamadas avanzado no funcionará debido a que la aplicación no la «Aplicación de teléfono»
  fi: Edistynyt puhelunesto ei toimi, koska sovellusta ei ole määritetty \"Puhelinsovellukseksi\"
  fr: Comme l’application n’est pas définie comme appli « téléphone », le blocage d’appel avancé ne fonctionnera pas
  gl: O Bloqueo Avanzado non funcionará porque a app non foi establecida como \"App de Teléfono\"
  he: חסימת שיחות מתקדמת לא תפעל עקב העובדה שהיישום אינו מוגדר כ\"יישום הטלפון\"
  hr: Napredno blokiranje poziva neće raditi, jer program nije postavljena kao „Program za telefoniranje”
  it: Il blocco avanzato delle chiamate non funziona a causa del fatto che l\'applicazione non è impostata come «App telefono»
  iw: חסימת שיחות מתקדמת לא תפעל עקב העובדה שהיישום אינו מוגדר כ\"יישום הטלפון\"
  nb-rNO: Avansert samtaleblokkering vil ikke fungere som følge av at programmet ikke er satt som \"Telefonprogram\"
  nl: Geavanceerde oproepblokkering werkt niet omdat de app niet is ingesteld als \'telefoonapp\'
  pl: Zaawansowane blokowanie połączeń nie będzie działać, ponieważ aplikacja nie jest ustawiona jako „Aplikacja do obsługi telefonu”
  pt: O bloqueio avançado de chamadas não funcionará devido à aplicação não estar configurada como \"aplicação de telefone/chamadas\"
  pt-rBR: O bloqueio avançado de chamadas não funcionará devido ao aplicativo não estar configurado como o \"aplicativo de Telefone\"
  ru: Продвинутый режим блокирования не сможет работать, поскольку приложение не назначено \"приложением для звонков\"
  sl: Napredno blokiranje klicev ne bo delovalo, ker aplikacija ni nastavljena kot »aplikacija za telefoniranje«
  tr: Uygulama \"Telefon uygulaması\" olarak ayarlanmadığı için gelişmiş arama engelleme çalışmayacak
  uk: Просунутий режим блокування не зможе працювати, тому що додаток не призначено \"додатком для дзвінків \"
  vi: Chặn cuộc gọi nâng cao sẽ không hoạt động do ứng dụng không được đặt làm \"Ứng dụng điện thoại\"
  zh-rCN: 由于本应用程序没有被设置为 “电话应用程序”，将无法使用高级呼叫拦截
  zh-rTW: 由於應用程式未設定為「電話應用程式」，因此進階通話阻止將會無法運作
denied_call_screening_role_message:
  comment: RoleManagerHelper toast
  en: Advanced call blocking won\'t work due to the app not being set as the \"Caller ID app\"
  de: Die erweiterte Anrufblockierung funktioniert nicht, weil die App nicht als „Anrufer-ID-App“ festgelegt ist
  ar: لن يعمل الحظر المتقدم للمكالمات بسبب عدم تعيين التطبيق على أنه \"تطبيق معرف المتصل\"
  ca: El bloqueig de trucades avançat no funcionarà perquè l\'aplicació no és l\'«aplicació d\'identificació de trucades»
  el: Ο σύνθετος αποκλεισμός κλήσεων δεν θα λειτουργήσει επειδή η εφαρμογή δεν έχει οριστεί ως \"Εφαρμογή αναγνώρισης κλήσης/προστασίας από ανεπιθύμητο περιεχόμενο\"
  eo: Altnivela alvoko-blokado ne funkcios pro ke ĉi tiu programo ne estas la implicita \"Programo por Identigi Alvokanton\"
  es: El bloqueo de llamadas avanzado no funcionara porque la aplicación no es la «Aplicación de identificación de llamadas»
  fi: Edistynyt puhelun esto ei toimi, koska sovellusta ei ole määritetty \"Soittajan tunnus -sovellukseksi\"
  fr: Comme l’application n’est pas définie comme appli de « reconnaissance d’appel entrant », le blocage d\'appel avancé ne fonctionnera pas
  gl: O Bloqueo Avanzado non funcionará porque a app non foi establecida como \"App identificadora de chamadas\"
  he: חסימת שיחות מתקדמת לא תפעל עקב העובדה שהיישום אינו מוגדר כ\"יישום מזהה המתקשר\"
  hr: Napredno blokiranje poziva neće raditi, jer program nije postavljena kao „Program za identifikaciju pozivača”
  it: Il blocco avanzato delle chiamate non funzionerà in quanto l\'app non è stata impostata per il Caller ID
  iw: חסימת שיחות מתקדמת לא תפעל עקב העובדה שהיישום אינו מוגדר כ\"יישום מזהה המתקשר\"
  nb-rNO: Avansert samtaleblokkering vil ikke fungere som følge av at programmet ikke har blitt satt som \"Samtale-ID-program\"
  nl: Geavanceerde oproepblokkering werkt niet omdat de app niet is ingesteld als \'nummermelder-app\'
  pl: Zaawansowane blokowanie połączeń nie będzie działać, ponieważ aplikacja nie jest ustawiona jako „Aplikacja do identyfikacji rozmówcy i spamu”
  pt: O bloqueio avançado de chamadas não funcionará devido à aplicação não estar definida como o \"Aplicação identificadora de chamadas\"
  pt-rBR: O bloqueio avançado de chamadas não funcionará devido ao aplicativo não estar definido como o \"aplicativo Identificador de Chamadas\"
  ru: Продвинутый режим блокирования не сможет работать, поскольку приложение не назначено \"приложением для АОН и защиты от спама\"
  sl: Napredno blokiranje klicev ne bo delovalo, ker aplikacija ni nastavljena kot »aplikacija klicatelja«
  tr: Uygulama \"Arayan kimliği uygulaması\" olarak ayarlanmadığı için gelişmiş arama engelleme çalışmayacak
  uk: Просунутий режим блокування не зможе працювати, тому що додаток не призначено \"додатком для АВН і захисту від спаму\"
  vi: Chặn cuộc gọi nâng cao sẽ không hoạt động do ứng dụng không được đặt làm \"Ứng dụng ID người gọi\"
  zh-rCN: 高级电话屏蔽功能没生效，因为没有将app 设置为Caller ID默认应用
  zh-rTW: 由於應用程式未設定為「來電顯示應用程式」，因此進階通話阻止將會無法運作
