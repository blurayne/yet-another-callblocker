  comment: unused
  en: About PhoneBlock
  de: Über PhoneBlock
phone_block_info_summary:
  comment: unused
  en: PhoneBlock (phoneblock.net) is a community that collects the numbers of unwanted callers, with a focus on Germany. Its list is downloaded and kept on the device, so looking a number up costs no network and nothing about your calls is sent anywhere
  de: 'PhoneBlock (phoneblock.net) ist eine Community, die die Nummern unerwünschter Anrufer sammelt, mit Schwerpunkt auf Deutschland. Die Liste wird heruntergeladen und auf dem Gerät gespeichert: Eine Nummer nachzuschlagen braucht keine Verbindung, und nichts über Ihre Anrufe verlässt das Gerät'
