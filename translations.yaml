  iw: מאפשר סינון במהלך הורדת ועדכון מסד הנתונים
  nl: Schakel filteren in tijdens het ophalen en bijwerken van de databank
  pl: Włącza filtrowanie podczas pobierania i aktualizacji bazy danych
  pt: Ativa a filtragem durante o descarregamento e atualização da base de dados
  pt-rBR: Habilita a filtragem durante o download e atualização do banco de dados
  ru: Включает фильтрацию во время загрузки и обновления базы
  tr: Veri tabanı indirme ve güncelleme sırasında filtrelemeyi etkinleştirir
  uk: Ввімкнути фільтрацію під час завантаження та оновлення бази даних
  vi: Bật việc lọc trong khi tải xuống và cập nhật cơ sở dữ liệu
db_filtering_prefixes_to_keep:
  comment: unused
  en: Prefixes to keep
  de: Zu behaltende Vorwahlen
  ar: البادئات التي يجب الاحتفاظ بها
  ca: Prefixos a mantenir
  eo: Tenotaj prefiksoj
  es: Prefijos a conservar
  fr: Préfixes à conserver
  gl: Prefixos a manter
  he: קידומות לשמירה
  hr: Zadržani predznaci
  it: Prefissi da conservare
  iw: קידומות לשמירה
  nl: Te bewaren landnummers
  pl: Prefiksy do zachowania
  pt: Prefixos para manter
  pt-rBR: Prefixos para manter
  ru: Префиксы для сохранения
  tr: Tutulacak ön ekler
  uk: Префікси для збереження
  vi: Các tiền tố để giữ lại
db_filtering_prefixes_to_keep_summary:
  comment: unused
  en: A comma-separated list of prefixes of numbers to keep. The prefixes should be in the international format (like +1234). E.g., if you only receive calls from numbers starting with +1, put +1 here
  de: Die Vorwahlen der Nummern, die behalten werden, durch Kommas getrennt und im internationalen Format (wie +49). Wenn Sie zum Beispiel nur Anrufe von Nummern erhalten, die mit +49 beginnen, tragen Sie hier +49 ein
  ar: قائمة بادئات الأرقام مفصولة بفواصل للاحتفاظ بها. يجب أن تكون البادئات بالتنسيق الدولي (مثل +1234). على سبيل المثال ، إذا تلقيت مكالمات فقط من أرقام تبدأ بـ +1 ، فضع +1 هنا
  ca: Una llista separada per comes de prefixos de números que cal mantenir. Els prefixos haurien d\'estar en format internacional (com ara +1234). Per exemple, si només rebeu trucades de números que comencen per +1, poseu +1 aquí
  es: Una lista separada por comas de los prefijos de los números que hay que conservar. Los prefijos deben tener el formato internacional (como +1234). Por ejemplo, si sólo recibe llamadas de números que empiezan por +1, ponga aquí +1
  fr: Une liste de préfixes de numéros à conserver, séparés par des virgules. Les préfixes doivent être au format international (comme +1234). Par exemple, si vous ne recevez que des appels de numéros commençant par +1, mettez +1 ici
  gl: Lista de prefixos de números a manter separados por vírgulas. Estos prefixos deben ter formato internacional (como +1234). Ex., se só queres recibir chamadas de números que comecen por +1, escribe +1 aquí
  he: רשימה מופרדת באמצעות פסיקים של קידומות מספרים לשמירה. הקידומת צריכה להיות בתבנית הבינלאומית (כמו +1234). למשל, אם מתקבלים אצלך שיחות רק ממספרים המתחילים ב- +1, יש להזין +1 כאן
  hr: Zarezom odvojen popis predznakova brojeva koje treba zadržati. Predznaci bi trebali biti u međunarodnom formatu (poput +1234). Na primjer, ako primaš pozive samo s brojeva koji počinju s +1, ovdje stavi +1
  it: Una lista separata da virgole di prefissi di numeri da conservare. I prefissi dovrebbero essere nel formato internazionale (come +1234). Ad esempio, se ricevi chiamate solo da numeri che iniziano con +1, metti +1 qui
  iw: רשימה מופרדת באמצעות פסיקים של קידומות מספרים לשמירה. הקידומת צריכה להיות בתבנית הבינלאומית (כמו +1234). למשל, אם מתקבלים אצלך שיחות רק ממספרים המתחילים ב- +1, יש להזין +1 כאן
  nl: Een kommagescheiden lijst met te bewaren landnummers. Deze dienen te worden ingevoerd met internationale opmaak (bijv. +1234). Als je bijv. alleen nummers ontvangt van landen met +1, voer hier dan +1 in
  pl: Rozdzielona przecinkami lista prefiksów numerów do zachowania. Prefiksy powinny być w międzynarodowym formacie (jak +1234). Np. jeśli otrzymujesz połączenia tylko z numerów zaczynających się od +48, wpisz tutaj +48
  pt: Uma lista separada por vírgulas de prefixos de números a serem mantidos. Os prefixos devem estar no formato internacional (como +1234). Por exemplo, se só recebe chamadas de números que começam com +1, ponha +1 aqui
  pt-rBR: Uma lista separada por vírgulas de prefixos de números a serem mantidos. Os prefixos devem estar no formato internacional (como +1234). Por exemplo, se você só recebe chamadas de números começando com +1, coloque +1 aqui
  ru: Список (разделённый запятыми) префиксов номеров, которые нужно сохранить. Префиксы должны быть в международном формате (например, +7999). Например, если вам звонят только номера начинающиеся на +7, введите сюда +7
  tr: Tutulacak numaraların ön eklerinin virgülle ayrılmış listesi. Ön ekler uluslararası biçimde olmalıdır (+1234 gibi). Örneğin, yalnızca +1 ile başlayan numaralardan arama alıyorsanız, buraya +1 koyun
  uk: Відокремлений комами перелік префіксів для збереження. Префікси повинні бути записані в міжнародному форматі (наприклад +380). Наприклад, якщо ви отримуєте дзвінки лише від +3, впишіть +3 сюди
  vi: 'Một danh sách các tiền tố của số điện thoại được chia tách bởi dấu phẩy để giữ lại. Các tiền tố nên ở định dạng quốc tế (như +1234). Vd: nếu bạn chỉ nhận các cuộc gọi từ các số bắt đầu bằng +1, hãy đặt +1 ở đây'
db_filtering_pattern:
  comment: db_filtering_preferences.xml title
  en: Which numbers to keep
  de: Welche Nummern behalten werden
db_filtering_pattern_summary:
  comment: DbFilteringSettingsFragment summary
  en: 'A pattern that a number has to match to be written into the database, in its international form: %s keeps the Netherlands, Austria, Switzerland and Germany. * stands for any digits, # for exactly one, and {a,b} for either. Everything else is left out as the sources are read.'
  de: 'Ein Muster, auf das eine Nummer in internationaler Form passen muss, um in die Datenbank zu kommen: %s behält die Niederlande, Österreich, die Schweiz und Deutschland. * steht für beliebige Ziffern, # für genau eine, {a,b} für das eine oder das andere. Alles andere wird beim Lesen der Quellen weggelassen.'
db_filtering_pattern_invalid:
  comment: DbFilteringSettingsFragment toast
  en: That pattern can\'t be read
  de: Dieses Muster lässt sich nicht lesen
build_log_filter:
  comment: DbCompileService build log
  en: Keeping numbers that match %s
  de: Behalten wird, was auf %s passt
build_log_no_filter:
  comment: DbCompileService
  en: Keeping every number
  de: Jede Nummer wird behalten
db_filtering_thorough:
  comment: db_filtering_preferences.xml title
  en: Thorough filtering
  de: Gründlich filtern
  ar: تصفية شاملة
  ca: Filtratge exhaustiu
  eo: Plena filtrado
  es: Filtrado exhaustivo
  fr: Filtrage minutieux
  gl: Filtrado completo
  he: סינון יסודי
  hr: Temeljito filtriranje
  it: Filtraggio accurato
  iw: סינון יסודי
  nl: Grondig filteren
  pl: Dokładne filtrowanie
  pt: Filtragem completa
  pt-rBR: Filtragem completa
  ru: Тщательная фильтрация
  ta: ''
  tr: Kapsamlı filtreleme
  uk: Ретельна фільтрація
  vi: Lọc kỹ
db_filtering_thorough_summary:
  comment: db_filtering_preferences.xml summary
  en: If enabled, it goes through every block of data and removes numbers not matching the prefixes. Otherwise, it only removes whole unwanted blocks (leaving some unwanted numbers in wanted blocks). It is recommended to leave this on. Required for keeping short numbers
  de: Wenn eingeschaltet, wird jeder Datenblock durchgesehen und jede Nummer entfernt, die zu keiner Vorwahl passt. Sonst werden nur ganze unerwünschte Blöcke entfernt (und in erwünschten Blöcken bleiben einige unerwünschte Nummern stehen). Es empfiehlt sich, das eingeschaltet zu lassen. Nötig, um kurze Nummern zu behalten
  ca: Si està activat, passa per a cada bloc de dades i elimina els números que no coincideixen amb els prefixos. En cas contrari, només elimina blocs sencers no desitjats (deixant alguns números no desitjats en blocs desitjats). Es recomana deixar-ho activat. Necessari per a mantenir números curts
  es: Si se activa, recorre cada bloque de datos y elimina los números que no coinciden con los prefijos. Si no, sólo elimina los bloques enteros no deseados (dejando algunos números no deseados en los bloques deseados). Se recomienda dejar esta opción activada. Necesario para mantener los números cortos
  fr: Si activé, ceci passe en revue chaque bloc de données et supprime les numéros ne correspondant pas aux préfixes. Sinon, on ne supprime que les blocs entiers non désirés (laissant quelques numéros non désirés dans les blocs désirés). Il est recommandé de laisser cette option activée. Nécessaire pour conserver les numéros courts
  gl: Se o activas, comprobará cada bloque de datos e eliminará os números que non concorden cos prefixos. Se non, só elimina os bloques non desexados ao completo (deixando algúns números non desexados nos bloques admitidos). É recomendable activar isto. Requerido para manter números curtos
  he: אם אפשרות זו זמינה, היא עוברת על כל בלוק נתונים ומסירה מספרים שאינם תואמים לקידומות. אחרת, זה רק מסיר בלוקים לא רצויים שלמים (משאיר כמה מספרים לא רצויים בלוקים מבוקשים). מומלץ להשאיר את זה פועל. נדרש לשמירת מספרים קצרים
  hr: Ako je aktivirano, prolazi kroz svaki blok podataka i uklanja brojeve koji se ne podudaraju s predznacima. Inače, uklanja samo cijele neželjene blokove (ostavljajući neke neželjene brojeve u željenim blokovima). Preporučujemo da ovo ostaviš uključeno. Potrebno za čuvanje kratkih brojeva
  it: Se abilitato, passa attraverso ogni blocco di dati e rimuove i numeri che non corrispondono ai prefissi. Altrimenti, rimuove solo interi blocchi indesiderati (lasciando alcuni numeri indesiderati nei blocchi desiderati). Si raccomanda di lasciarlo attivo. Richiesto per conservare i numeri brevi
  iw: אם אפשרות זו זמינה, היא עוברת על כל בלוק נתונים ומסירה מספרים שאינם תואמים לקידומות. אחרת, זה רק מסיר בלוקים לא רצויים שלמים (משאיר כמה מספרים לא רצויים בלוקים מבוקשים). מומלץ להשאיר את זה פועל. נדרש לשמירת מספרים קצרים
  nl: Schakel in om elk gegevensblok grondig te doorlopen en nummers te wissen die niet overeenkomen met de landnummers. Schakel uit om gehele onnodige blokken te wissen, waardoor enkele ongewenste nummers kunnen achterblijven. Wij raden aan deze functie in te schakelen
  pl: Jeśli włączone, przetwarza każdy blok danych i usuwa numery niepasujące do prefiksów. W przeciwnym razie usuwa całe niechciane bloki (pozostawiając niektóre niechciane numery w chcianych blokach). Zaleca się pozostawienie tej opcji włączonej. Wymagane do zachowania krótkich numerów
  pt: Se ativado, percorre todos os blocos de dados e remove os números que não correspondem aos prefixos. Caso contrário, remove apenas blocos indesejados inteiros (deixando alguns números indesejados nos blocos desejados). Recomenda-se deixar isto ativado. Obrigatório para manter números curtos
  pt-rBR: Se ativado, ele percorre todos os blocos de dados e remove os números que não correspondem aos prefixos. Caso contrário, ele remove apenas blocos indesejados inteiros (deixando alguns números indesejados nos blocos desejados). Recomenda-se deixar isso ativado. Obrigatório para manter números curtos
  ru: Если включена, фильтрация проходит по всем блокам данных и удаляет номера, не подходящие по префиксам. В противном случае удаляются только целые блоки (оставляя некоторые лишние номера в сохраняемых блоках). Рекомендуется оставить включённым. Требуется для сохранения коротких номеров
  tr: Etkinleştirilirse, her veri bloğunu inceler ve ön eklerle eşleşmeyen numaraları kaldırır. Aksi takdirde, yalnızca bütün halinde istenmeyen blokları kaldırır (istenmeyen bloklarda bazı istenmeyen numaralar bırakır). Bunu açık bırakmanız önerilir. Kısa numaraları tutmak için gereklidir
  uk: Якщо ввімкнено, додаток пройде через кожен блок даних і видалить номера, що не відповідають префіксам. В іншому випадку він видалить лише цілі небажані номери (залишаючи деякі небажані номери в бажаних блоках). Рекомендується залишити це увімкненим. Необхідний для збереження коротких номерів
  vi: Nếu được bật, nó đi qua mọi khối dữ liệu và xoá các số không khớp với các tiền tố. Nếu không, nó chỉ xoá toàn bộ các khối không mong muốn (để lại một số số không mong muốn trong các khối mong muốn). Chúng tôi khuyên bạn cứ để bật tuỳ chọn này. Được yêu cầu để giữ lại các số ngắn
db_filtering_keep_short_numbers:
  comment: db_filtering_preferences.xml title
  en: Keep short numbers
  de: Kurze Nummern behalten
  ca: Mantenir números curts
  eo: Teni mallongajn telefonnumerojn
  es: Mantener los números cortos
  fr: Conserver les numéros courts
  gl: Manter números curtos
  he: שמית מספרים קצרים
  hr: Zadrži kratke brojeve
  it: Conserva numeri brevi
  iw: שמית מספרים קצרים
  nl: Korte nummers bewaren
  pl: Zachowaj krótkie numery
  pt: Manter números curtos
  pt-rBR: Mantenha números curtos
  ru: Сохранять короткие номера
  ta: குறுகிய எண்களை வை
  tr: Kısa numaraları tut
  uk: Залишити короткі номери
  vi: Giữ lại các số ngắn
db_filtering_keep_short_numbers_summary:
  comment: db_filtering_preferences.xml summary
  en: Keep numbers shorter than the specified length regardless of prefixes
  de: Nummern bis zur angegebenen Länge unabhängig von den Vorwahlen behalten
  ca: Mantenir els números més curts que la longitud especificada, independentment dels prefixos
  eo: Teni numerojn pli mallongajn ol la specifita longo, sendepende de prefiksoj
  es: Mantenga los números más cortos que la longitud especificada independientemente de los prefijos
  fr: Conserver les numéros plus courts que la longueur spécifiée, sans tenir compte des préfixes
  gl: Manter números máis curtos que a lonxitude indicada independentemente do prefixo
  he: שמירה על מספרים קצרים מהאורך שצוין ללא קשר לקידומות
  hr: Zadrži brojeve kraćima od određenog broja znamenaka, bez obzira na predznake
  it: Conserva i numeri più corti della lunghezza specificata indipendentemente dai prefissi
  iw: שמירה על מספרים קצרים מהאורך שצוין ללא קשר לקידומות
  nl: Bewaar nummers die korter zijn dan de opgegeven lengte (landnummers niet meegeteld)
  pl: Zachowuje numery krótsze niż określona długość, niezależnie od prefiksów
  pt: Mantém os números menores do que o comprimento especificado, independentemente dos prefixos
  pt-rBR: Mantenha os números menores do que o comprimento especificado, independentemente dos prefixos
  ru: Сохранять номера, короче указанной длины, вне зависимости от префиксов
  tr: Ön eklerden bağımsız olarak belirtilen uzunluktan daha kısa numaraları tut
  uk: Залишити номери коротші за вказану довжину незалежно від префіксів
  vi: Giữ các số ngắn hơn độ dài được chỉ định mà không tính đến các tiền tố
db_filtering_keep_short_numbers_max_length:
  comment: db_filtering_preferences.xml title
  en: Length of numbers to keep
  de: Länge der zu behaltenden Nummern
  ca: Longitud dels números a mantenir
  eo: Nombro de tenotaj ciferoj
  es: Longitud de los números a conservar
  fr: Longueur des numéros à conserver
  gl: Lonxitude dos números a manter
  he: אורך המספרים לשמירה
  hr: Zadržani broj znamenaka broja
  it: Lunghezza dei numeri da conservare
  iw: אורך המספרים לשמירה
  nl: Lengte van te bewaren nummers
  pl: Długość numerów do zachowania
  pt: Comprimento dos números a manter
  pt-rBR: Comprimento dos números para manter
  ru: Длина номеров для сохранения
  tr: Tutulacak numaraların uzunluğu
  uk: Довжина номеру для збереження
  vi: Độ dài các số để giữ lại
db_filtering_keep_short_numbers_max_length_summary:
  comment: db_filtering_preferences.xml summary
  en: The maximum length (inclusive) of short numbers to keep regardless of prefixes. E.g. the value of 5 will keep numbers with length of 5 digits or shorter
  de: Die größte Länge (einschließlich), bis zu der kurze Nummern unabhängig von den Vorwahlen behalten werden. Beim Wert 5 werden zum Beispiel Nummern mit höchstens 5 Ziffern behalten
  ca: La longitud màxima (inclosa) dels nombres curts que cal mantenir independentment dels prefixos. Per exemple el valor de 5 mantindrà els números amb una longitud de 5 dígits o menys
  es: La longitud máxima (inclusive) de los números cortos que se mantendrá sin tener en cuenta los prefijos. Por ejemplo, el valor de 5 mantendrá los números con una longitud de 5 dígitos o menos
  fr: La longueur maximale (inclusive) des numéros courts à conserver sans tenir compte des préfixes. Par exemple, la valeur 5 permet de conserver les numéros de 5 chiffres ou moins
  gl: A lonxitude máxima (inclusiva) dos números curtos a manter independentemente do prefixo. Ex., se o valor é 5 manterás os números de 5 díxitos ou máis curtos
  he: האורך המרבי (כולל) של מספרים קצרים לשמירה ללא קשר לקידומות. למשל, הערך 5 ישמור מספרים באורך של 5 ספרות או פחות
  hr: Maksimalni (uključujući) broj znamenaka kratkih brojeva koji se zadržavaju bez obzira na predznake. Npr. vrijednost 5 zadržat će brojeve s 5 znamenaka ili kraće
  it: La lunghezza massima (inclusa) dei numeri brevi da mantenere indipendentemente dai prefissi. Ad esempio, il valore 5 manterrà i numeri di lunghezza pari o inferiore a 5 cifre
  iw: האורך המרבי (כולל) של מספרים קצרים לשמירה ללא קשר לקידומות. למשל, הערך 5 ישמור מספרים באורך של 5 ספרות או פחות
  nl: 'De maximale lengte van korte nummers, landnummers niet meegeteld. Voorbeeld: een waarde van 5 bewaart nummers met 5 of minder getallen'
  pl: Maksymalna długość (włącznie) krótkich numerów do przechowania, niezależnie od prefiksów. Np. wartość 5 zachowa numery o długości 5 cyfr lub krótsze
  pt: O comprimento máximo (inclusivo) de números curtos a serem mantidos, independentemente dos prefixos. Por exemplo, o valor de 5 manterá os números com comprimento de 5 dígitos ou menos
  pt-rBR: O comprimento máximo (inclusivo) de números curtos a serem mantidos, independentemente dos prefixos. Por exemplo. O valor de 5 manterá os números com comprimento de 5 dígitos ou menos
  ru: Максимальная длина (включительная) коротких номеров, которые нужно сохранить вне зависимости от префиксов. Например, значение 5 сохранит номера длиной 5 цифр и короче
  tr: Ön eklerden bağımsız olarak tutulacak kısa numaraların (dahil olacak şekilde) azami uzunluğu. Örneğin; 5 değeri, 5 basamaklı veya daha kısa olan numaraları tutacaktır
  uk: Максимальна довжина (включно) коротких номерів для ігнорування префіксів. Наприклад довжина 5 залишатиме номери з довжиною 5 цифр та коротші
  vi: 'Độ dài tối đa của các số ngắn để giữ lại mà không tính đến các tiền tố. Vd: giá trị 5 sẽ giữ lại các số có độ dài 5 chữ số hoặc ngắn hơn'
compiling_db:
