no_main_db_text:
  comment: unused
  ar: قاعدة البيانات غير موجودة. لكي يؤدي التطبيق معظم وظائفه ، تحتاج إلى تنزيل DB. سوف يستغرق حوالي 25 ميغابايت من حركة المرور.
  ca: La base de dades no està present. L\'aplicació necessita descarregar la BD per realitzar la majoria d\'operacions. Requerirà uns 25 MB de tràfic.
  el: Η βάση δεδομένων δεν υπάρχει. Για να εκτελέσει η εφαρμογή τις περισσότερες από τις λειτουργίες της, πρέπει να πραγματοποιήσετε λήψη της βάσης δεδομένων. Θα χρειαστούν περίπου 25 MB δεδομένων.
  eo: Datenbanko mankas. Por uzi la plejparton de la funkcioj de ĉi tiu programo, vi devas elŝuti la datenbankon. Tio uzos ĉirkaŭ 25 megabajtojn da trafiko.
  es: La base de datos no está presente. Para que la aplicación realice la mayor parte de sus funciones necesitas descargar la base de datos. Tomará alrededor de 25 MB de tráfico.
  fi: Tietokantaa ei ole. Jotta sovellus voi suorittaa suurimman osan toiminnoista, sinun on ladattava tietokanta. Se vie noin 25 Mt liikennettä.
  fr: La base de données n\'est pas disponible. Pour que l\'application puisse remplir la plupart de ses fonctions, vous devez la télécharger. Cela nécessitera environ 25 Mo de données.
  gl: Non hai base de datos. Para que a app realice o seu traballo ten que descargar a base de datos. Son aproximadamente 25 MB de datos.
  he: מסד הנתונים אינו קיים. כדי שהיישום יבצע את רוב האפשרויות שלו, עליך להוריד מסד נתונים. זה ייקח בערך 25 מגה של תעבורה.
  hr: Baza podataka nije prisutna. Da bi program obavio većinu svojih funkcija, moraš preuzeti bazu podataka. Trebat će oko 25 MB prometa.
  it: La base di dati non è presente. Affinché l\'applicazione possa svolgere la maggior parte delle sue funzioni è necessario scaricarla. Serviranno circa 25 MB di traffico.
  iw: מסד הנתונים אינו קיים. כדי שהיישום יבצע את רוב האפשרויות שלו, עליך להוריד מסד נתונים. זה ייקח בערך 25 מגה של תעבורה.
  nb-rNO: Databasen finnes ikke. For at programmet skal utføre brorparten av dets funksjoner må du laste ned databasen. Den er omtrent 25 MB.
  nl: Er is nog geen databank aanwezig. Om de app te laten werken moet je een databank downloaden. Dit kost 25 MB aan data.
  pl: Brak bazy danych. Aby aplikacja mogła wykonywać większość swoich funkcji, musi zostać pobrana baza danych. Zajmie to około 25 MB ruchu sieciowego.
  pt: A base de dados não está disponível. Para que a aplicação realize a maioria das funções, tem de descarregar a base de dados. O ficheiro tem cerca de 25 MB.
  pt-rBR: O banco de dados não está disponível. Para que o aplicativo execute a maioria de suas funções, você precisa fazer o download do BD. O arquivo tem cerca de 25 MB.
  ru: База номеров отсутствует. Для полноценной работы приложения требуется загрузка базы номеров (около 25 МБ трафика).
  sl: Zbirka podatkov ni prisotna. Da aplikacija lahko izvaja večino svojih funkcij, morate prenesti DB. Potrebnih bo približno 25 MB prometa.
  ta: தரவுத்தளம் இல்லை. செயலி அதன் பல வேலைகளைச் செய்ய தரவுத்தளம் பதிவிறகப்படவேண்டும். 25MB எடுத்துக்கொள்ளும்.
  tr: Veri tabanı mevcut değil. Uygulamanın işlevlerinin çoğunu gerçekleştirmesi için veri tabanını indirmeniz gerekmektedir. Yaklaşık 25 MB veri indirilecektir.
  uk: База номерів відсутня. Для повноцінної роботи програми потрібно завантаження бази номерів (близько 25 МБ трафіку).
  vi: Cơ sở dữ liệu không có sẵn. Để ứng dụng thực hiện đa số tính năng của nó, bạn cần tải cơ sở dữ liệu xuống. Việc này sẽ tốn khoảng 25 MB lưu lượng.
  zh-rCN: 数据库不存在。为了让本应用程序执行其主要功能，你需要下载数据库。这将需要大约25MB的流量。
  zh-rTW: 資料庫不存在。為了使應用程式執行其大部分功能，你需要下載資料庫。大約需要 25 MB 的網絡流量。
